<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BALL x PIT Matchmaker - GRIM_CYANIDE</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png">
    <link rel="manifest" href="/site.webmanifest">
    <style>
        body {
            background: #0a0a0a;
            color: #00ffff;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 3em;
            margin: 0;
            text-shadow: 0 0 12px #00ffff, 0 0 24px #00ffff;
            letter-spacing: 3px;
            font-weight: normal;
        }

        .home-button {
            display: inline-block;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid #00ffff;
            border-radius: 8px;
            padding: 12px 24px;
            text-decoration: none;
            color: #00ffff;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }

        .home-button:hover {
            background: rgba(0, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .slot-machine {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            margin: 40px 0;
            position: relative;
        }

        .slot {
            width: 200px;
            height: 250px;
            border: 2px solid #00ffff;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            background: #001a1a;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }

        .character-display {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            box-sizing: border-box;
        }

        .character-image {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid #00ffff;
            margin-bottom: 10px;
        }

        .character-name {
            font-weight: bold;
            color: #88ffff;
            font-size: 1.1em;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
        }

        .vs {
            font-size: 2em;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
        }

        .result {
            margin: 30px 0;
            font-size: 1.5em;
            color: #88ffff;
            min-height: 60px;
        }

        .spin-button {
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid #00ffff;
            border-radius: 10px;
            padding: 15px 40px;
            color: #00ffff;
            font-size: 1.2em;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .spin-button:hover {
            background: rgba(0, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 255, 255, 0.4);
        }

        .spin-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .invalid-combination {
            color: #ff4444;
            margin-top: 15px;
            font-size: 1.1em;
        }

        .disclaimer {
            margin-top: 50px;
            color: #008888;
            font-size: 0.9em;
            padding: 20px;
            border-top: 1px solid #004444;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.4;
        }

        @media (max-width: 768px) {
            .slot-machine {
                flex-direction: column;
                gap: 20px;
            }
            
            .vs {
                transform: rotate(90deg);
            }
            
            .header h1 {
                font-size: 2.2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://grimcyanide.com" class="home-button">← Back to Home</a>
        
        <div class="header">
            <h1>BALL x PIT MATCHMAKER</h1>
        </div>

        <div class="slot-machine">
            <div class="slot" id="slot1">
                <div class="character-display" id="display1">
                    <img src="/the_cohabitants.avif" alt="The Cohabitants" class="character-image">
                    <div class="character-name">The Cohabitants</div>
                </div>
            </div>
            
            <div class="vs">X</div>
            
            <div class="slot" id="slot2">
                <div class="character-display" id="display2">
                    <img src="/the_shade.avif" alt="The Shade" class="character-image">
                    <div class="character-name">The Shade</div>
                </div>
            </div>
        </div>

        <div class="result" id="result">The Cohabitants × The Shade</div>
        
        <button class="spin-button" id="spinButton">SPIN MATCHMAKER</button>
        <div class="invalid-combination" id="invalidMessage"></div>

        <div class="disclaimer">
            Not affiliated with BALL x PIT, Kenny Sun, or Devolver Digital. This is a fan-made tool for entertainment purposes.
        </div>
    </div>

    <script>
        const characters = [
            { id: 1, name: "The Warrior", image: "/the_warrior.avif" },
            { id: 2, name: "The Itchy Finger", image: "/the_itchy_finger.avif" },
            { id: 3, name: "The Repentant", image: "/the_repentant.avif" },
            { id: 4, name: "The Cohabitants", image: "/the_cohabitants.avif" },
            { id: 5, name: "The Cogitator", image: "/the_cogitator.avif" },
            { id: 6, name: "The Embedded", image: "/the_embedded.avif" },
            { id: 7, name: "The Empty Nester", image: "/the_empty_nester.avif" },
            { id: 8, name: "The Shade", image: "/the_shade.avif" },
            { id: 9, name: "The Shieldbearer", image: "/the_shieldbearer.avif" },
            { id: 10, name: "The Spendthrift", image: "/the_spendthrift.avif" },
            { id: 11, name: "The Flagellant", image: "/the_flagellant.avif" },
            { id: 12, name: "The Juggler", image: "/the_juggler.avif" },
            { id: 13, name: "The Tactician", image: "/the_tactician.avif" },
            { id: 14, name: "The Radical", image: "/the_radical.avif" },
            { id: 15, name: "The Physicist", image: "/the_physicist.avif" },
            { id: 16, name: "The Makeshift Sisyphus", image: "/the_makeshift_sisyphus.avif" }
        ];

        const invalidCombinations = [
            [3, 9],
            [3, 11],
            [4, 16],
            [4, 10],
            [4, 12],
            [8, 16],
            [9, 11],
            [16, 10]
        ];

        let isSpinning = false;
        let currentChar1 = characters[3];
        let currentChar2 = characters[7];

        function updateDisplay(displayElement, character) {
            displayElement.innerHTML = `
                <img src="${character.image}" alt="${character.name}" class="character-image" onerror="this.style.display='none'">
                <div class="character-name">${character.name}</div>
            `;
        }

        function spinReels() {
            if (isSpinning) return;
            
            isSpinning = true;
            const spinButton = document.getElementById('spinButton');
            const resultDiv = document.getElementById('result');
            const invalidMessage = document.getElementById('invalidMessage');
            const display1 = document.getElementById('display1');
            const display2 = document.getElementById('display2');
            
            spinButton.disabled = true;
            resultDiv.textContent = '';
            invalidMessage.textContent = '';

            const startTime = Date.now();
            const totalDuration = 3000;
            let fastPhase = true;
            let interval = 80;

            function cycleCharacters() {
                const elapsed = Date.now() - startTime;
                const progress = elapsed / totalDuration;

                if (progress < 1) {
                    if (progress > 0.7 && fastPhase) {
                        fastPhase = false;
                        interval = 200;
                    } else if (progress > 0.9 && !fastPhase) {
                        interval = 400;
                    }

                    const randomChar1 = characters[Math.floor(Math.random() * characters.length)];
                    const randomChar2 = characters[Math.floor(Math.random() * characters.length)];
                    
                    updateDisplay(display1, randomChar1);
                    updateDisplay(display2, randomChar2);
                    
                    setTimeout(cycleCharacters, interval);
                } else {
                    let char1, char2;
                    let isValid = false;
                    let attempts = 0;
                    
                    while (!isValid && attempts < 100) {
                        char1 = characters[Math.floor(Math.random() * characters.length)];
                        char2 = characters[Math.floor(Math.random() * characters.length)];
                        if (char1.id !== char2.id && !isInvalidCombination(char1.id, char2.id)) {
                            isValid = true;
                        }
                        attempts++;
                    }
                    
                    if (!isValid) {
                        char1 = characters[Math.floor(Math.random() * characters.length)];
                        do {
                            char2 = characters[Math.floor(Math.random() * characters.length)];
                        } while (char1.id === char2.id);
                    }
                    
                    updateDisplay(display1, char1);
                    updateDisplay(display2, char2);
                    
                    resultDiv.textContent = `${char1.name} × ${char2.name}`;
                    if (isInvalidCombination(char1.id, char2.id)) {
                        invalidMessage.textContent = "⚠️ These characters cannot be paired together!";
                    }
                    
                    isSpinning = false;
                    spinButton.disabled = false;
                }
            }

            cycleCharacters();
        }

        function isInvalidCombination(id1, id2) {
            return invalidCombinations.some(pair => 
                (pair[0] === id1 && pair[1] === id2) || 
                (pair[0] === id2 && pair[1] === id1)
            );
        }

        document.getElementById('spinButton').addEventListener('click', spinReels);
    </script>
</body>
</html>
