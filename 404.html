<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - GRIM_CYANIDE</title>
    <style>
        :root {
            --bg: #0b0e11;
            --surface: #14181d;
            --border: #252a30;
            --text: #c8cdd2;
            --muted: #6b7280;
            --accent: #e85d75;
            --radius: 6px;
            --font: system-ui, -apple-system, 'Segoe UI', sans-serif;
        }
        * { box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            margin: 0; padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .container { padding: 40px 20px; }
        h1 { font-size: 4em; margin: 0; font-weight: 700; color: var(--accent); }
        p { color: var(--muted); font-size: 1.1em; margin: 10px 0 30px; }
        a {
            display: inline-block;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 24px;
            color: var(--text);
            text-decoration: none;
            font-size: 0.9em;
            font-weight: 500;
            transition: border 0.2s, background 0.2s;
        }
        a:hover { border-color: var(--accent); background: rgba(232, 93, 117, 0.1); }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <p>this page doesn't exist</p>
        <a href="https://grimcyanide.com">← back to grimcyanide.com</a>
    </div>
</body>
</html>
