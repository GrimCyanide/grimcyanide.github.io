<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Steam Library - GRIM_CYANIDE</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="description" content="GRIM_CYANIDE - Steam game library">
    <meta property="og:title" content="Steam Library - GRIM_CYANIDE">
    <meta property="og:description" content="My full Steam game library">
    <meta property="og:image" content="https://grimcyanide.com/android-chrome-512x512.png">
    <meta property="og:url" content="https://grimcyanide.com/steam">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Steam Library - GRIM_CYANIDE">
    <meta name="twitter:description" content="My full Steam game library">
    <meta name="twitter:image" content="https://grimcyanide.com/android-chrome-512x512.png">
    <style>
        :root {
            --bg: #0b0e11;
            --surface: #14181d;
            --surface-alt: #181c22;
            --border: #252a30;
            --text: #c8cdd2;
            --muted: #6b7280;
            --accent: #e85d75;
            --accent-soft: rgba(232, 93, 117, 0.15);
            --amber: #d2991d;
            --green: #4ade80;
            --blue: #58a6ff;
            --badge-bg: rgba(48, 54, 61, 0.8);
            --radius: 6px;
            --font: system-ui, -apple-system, 'Segoe UI', sans-serif;
            --mono: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
        }
        body.light-mode {
            --bg: #f3f4f6;
            --surface: #ffffff;
            --surface-alt: #f9fafb;
            --border: #d1d5db;
            --text: #1f2937;
            --muted: #6b7280;
            --accent: #b91c1c;
            --accent-soft: rgba(185, 28, 28, 0.1);
            --amber: #92400e;
            --green: #15803d;
            --blue: #0969da;
            --badge-bg: rgba(209, 213, 219, 0.6);
        }
        * { box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            margin: 0; padding: 0;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
            line-height: 1.5;
        }
        .container { max-width: 1000px; margin: 0 auto; padding: 32px 24px; }
        .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; flex-wrap: wrap; gap: 12px; }
        .back-link { color: var(--muted); text-decoration: none; font-size: 0.95em; font-family: var(--mono); transition: color 0.2s; }
        .back-link:hover { color: var(--accent); }
        .theme-toggle { background: none; border: 1px solid var(--border); border-radius: 4px; color: var(--muted); font-family: var(--font); font-size: 0.8em; padding: 6px 12px; cursor: pointer; transition: all 0.15s; }
        .theme-toggle:hover { border-color: var(--accent); color: var(--text); }
        .header { text-align: center; margin-bottom: 28px; }
        .header h1 { font-size: 2.2em; margin: 0 0 6px 0; font-weight: 700; letter-spacing: -0.5px; }
        .header .subtitle { color: var(--muted); font-size: 1em; margin: 0; }
        .steam-profile { text-align: center; margin-bottom: 24px; font-family: var(--mono); font-size: 0.88em; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .steam-status { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .steam-status.online { background: var(--green); }
        .steam-status.offline { background: var(--muted); }
        .steam-profile a { color: var(--blue); text-decoration: none; font-size: 0.95em; }
        .steam-profile a:hover { opacity: 0.7; }
        .stats-bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-bottom: 28px; }
        .stat-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 20px; text-align: center; min-width: 120px; }
        .stat-value { font-size: 1.4em; font-weight: 700; font-family: var(--mono); color: var(--accent); }
        .stat-label { font-size: 0.72em; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin-top: 2px; }
        .filters-section { display: flex; justify-content: center; margin-bottom: 24px; }
        .filter-group { display: flex; align-items: center; gap: 6px; }
        .filter-group label { color: var(--muted); font-size: 0.85em; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; white-space: nowrap; }
        .filter-group input { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 14px; font-family: var(--font); font-size: 0.92em; outline: none; transition: border 0.2s, box-shadow 0.2s; width: 280px; }
        .filter-group input:hover { border-color: var(--accent); }
        .filter-group input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
        .result-count { color: var(--muted); font-size: 0.88em; margin-bottom: 12px; font-family: var(--mono); text-align: center; }
        .table-wrapper { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--border); }
        table { width: 100%; border-collapse: collapse; }
        thead th { background: var(--surface); color: var(--muted); font-size: 0.82em; text-transform: uppercase; letter-spacing: 0.6px; font-weight: 600; padding: 12px 12px; text-align: center; cursor: pointer; user-select: none; white-space: nowrap; border-bottom: 1px solid var(--border); transition: color 0.15s; }
        thead th:hover { color: var(--accent); }
        thead th .arrow { margin-left: 4px; font-size: 0.7em; opacity: 0.5; }
        thead th.sorted { color: var(--accent); }
        thead th.sorted .arrow { opacity: 1; color: var(--accent); }
        tbody td { padding: 10px 12px; font-size: 0.9em; font-weight: 500; border-bottom: 1px solid var(--border); vertical-align: middle; word-break: break-word; text-align: center; }
        tbody tr td { background: var(--surface); }
        tbody tr:nth-child(even) td { background: var(--surface-alt); }
        tbody tr:hover td { background: var(--badge-bg); }
        tbody tr:last-child td { border-bottom: none; }
        .game-name { font-weight: 600; text-align: left; }
        .game-name a { color: inherit; text-decoration: none; cursor: pointer; }
        .game-name a:hover { color: var(--accent); }
        .game-playtime { font-family: var(--mono); color: var(--muted); font-size: 0.85em; white-space: nowrap; }
        .game-recent { font-family: var(--mono); color: var(--green); font-size: 0.78em; white-space: nowrap; display: block; }
        .game-lastplayed { font-family: var(--mono); color: var(--muted); font-size: 0.82em; white-space: nowrap; }
        .game-logo { width: 32px; height: 32px; border-radius: 4px; object-fit: cover; }
        .ach-btn { background: var(--surface); border: 1px solid var(--blue); border-radius: 4px; color: var(--blue); cursor: pointer; font-size: 0.73em; padding: 4px 10px; font-family: var(--font); font-weight: 600; transition: all 0.15s; white-space: nowrap; }
        .ach-btn:hover { background: rgba(88, 166, 255, 0.1); border-color: var(--blue); }
        .loading-container { text-align: center; padding: 48px 20px; }
        .loading-spinner { display: inline-block; width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: var(--muted); margin-top: 12px; font-size: 0.95em; }
        .error-container { text-align: center; padding: 32px 20px; color: #f85149; font-size: 0.95em; }
        .footer { margin-top: 40px; color: var(--muted); font-size: 0.85em; text-align: center; font-family: var(--mono); }
        .footer a { color: var(--muted); text-decoration: none; }
        .footer a:hover { color: var(--accent); }
        .popup-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 999; justify-content: center; align-items: center; }
        .popup-overlay.active { display: flex; }
        .popup-inner { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; max-width: 550px; width: 90%; max-height: 70vh; overflow-y: auto; text-align: center; }
        .popup-inner h3 { margin: 0 0 12px 0; font-size: 1.1em; }
        .popup-inner p { color: var(--muted); margin-bottom: 20px; font-size: 0.92em; }
        .popup-inner .ach-summary { color: var(--muted); margin-bottom: 16px; font-size: 0.9em; }
        .popup-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .popup-btn { padding: 10px 20px; border-radius: var(--radius); font-family: var(--font); font-size: 0.9em; font-weight: 600; cursor: pointer; transition: all 0.15s; text-decoration: none; }
        .popup-btn-primary { background: var(--blue); border: none; color: #fff; }
        .popup-btn-primary:hover { opacity: 0.85; }
        .popup-btn-secondary { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
        .popup-btn-secondary:hover { border-color: var(--accent); }
        .ach-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 0.88em; text-align: left; }
        .ach-row:nth-child(odd) { background: rgba(255,255,255,0.01); }
        .ach-icon { font-size: 1.1em; flex-shrink: 0; width: 20px; text-align: center; }
        .ach-icon.unlocked { color: var(--green); }
        .ach-icon.locked { color: var(--muted); opacity: 0.3; }
        .ach-info { flex: 1; min-width: 0; }
        .ach-name { font-weight: 600; font-size: 0.95em; }
        .ach-desc { color: var(--muted); font-size: 0.8em; margin-top: 1px; }
        .popup-close { background: var(--border); border: none; color: var(--text); padding: 8px 16px; border-radius: 4px; cursor: pointer; margin-top: 16px; font-family: var(--font); font-size: 0.85em; width: 100%; }
        .popup-close:hover { background: var(--accent); }
        @media (max-width: 700px) {
            .container { padding: 16px 4px; }
            .header h1 { font-size: 1.6em; }
            .stats-bar { gap: 6px; }
            .stat-item { padding: 8px 10px; min-width: 70px; }
            .stat-value { font-size: 1em; }
            .filter-group input { width: 220px; }
            thead th { font-size: 0.55em; padding: 6px 3px; letter-spacing: 0; }
            tbody td { font-size: 0.65em; padding: 8px 3px; }
            .game-logo { width: 18px; height: 18px; }
            .game-playtime { font-size: 0.75em; }
            .game-lastplayed { font-size: 0.72em; }
            .game-recent { font-size: 0.68em; }
            .ach-btn { font-size: 0.65em; padding: 3px 7px; }
            .popup-inner { max-width: 95%; padding: 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <a href="https://grimcyanide.com" class="back-link">← grimcyanide.com</a>
            <button class="theme-toggle" id="themeToggle">light/dark</button>
        </div>
        <div class="header">
            <h1>My Steam Library</h1>
            <p class="subtitle">every game I own on Steam</p>
        </div>
        <div class="steam-profile" id="steamProfile">
            <span class="steam-status offline" id="steamStatusDot"></span>
            <span id="steamStatusText">loading...</span>
            <a href="https://steamcommunity.com/id/GrimCyanide" target="_blank" id="steamProfileLink">view profile →</a>
        </div>
        <div class="stats-bar" id="statsBar"></div>
        <div class="filters-section">
            <div class="filter-group">
                <input type="text" id="searchInput" placeholder="Filter games...">
            </div>
        </div>
        <div class="result-count" id="resultCount"></div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th style="width:36px"></th>
                        <th style="text-align:left" data-col="name" id="thName">Game <span class="arrow"></span></th>
                        <th style="width:90px" data-col="playtime" id="thPlaytime">Playtime <span class="arrow"></span></th>
                        <th style="width:100px" data-col="lastplayed" class="sorted" id="thLastPlayed">Last Played <span class="arrow">▼</span></th>
                        <th style="width:80px"></th>
                    </tr>
                </thead>
                <tbody id="gamesBody">
                    <tr><td colspan="5"><div class="loading-container"><div class="loading-spinner"></div><p class="loading-text">Loading library...</p></div></td></tr>
                </tbody>
            </table>
        </div>
        <div class="footer">© 2026 <a href="https://grimcyanide.com">grimcyanide.com</a> — data from Steam</div>
    </div>
    <div class="popup-overlay" id="popupOverlay">
        <div class="popup-inner" id="popupInner"></div>
    </div>
    <script>
        var allGames = [];
        var currentSort = 'recent';
        var sortDirections = { name: 'name-az', playtime: 'playtime-desc', lastplayed: 'recent' };
        var sortToggles = {
            'name-az': 'name-za', 'name-za': 'name-az',
            'playtime-desc': 'playtime-asc', 'playtime-asc': 'playtime-desc',
            'recent': 'oldest', 'oldest': 'recent'
        };
        var columnIds = { name: 'thName', playtime: 'thPlaytime', lastplayed: 'thLastPlayed' };
        var steamId = '76561198066010654';
        var gamesApiURL = 'https://grimcyanide-github-io.vercel.app/api/steam-games';
        var achApiURL = 'https://grimcyanide-github-io.vercel.app/api/steam-achievements';
        var excludeIds = [629520, 1009850, 1125480, 914690, 2687190, 1587560, 1773890, 2776810, 1493300, 2013900, 1446330, 2667970, 2743080, 1471530];

        function loadData() {
            var body = document.getElementById('gamesBody');
            var url = gamesApiURL + '?steamid=' + steamId + '&type=owned&t=' + Date.now();
            fetch(url)
                .then(function(r) { if (!r.ok) throw new Error('API returned ' + r.status); return r.json(); })
                .then(function(data) {
                    if (data.error) throw new Error(data.error);
                    if (!data.games || !data.games.length) {
                        body.innerHTML = '<tr><td colspan="5"><div class="error-container">No games found. Make sure your Steam profile is public.</div></td></tr>';
                        return;
                    }
                    allGames = data.games.filter(function(g) { return excludeIds.indexOf(g.appid) === -1; });
                    renderStats();
                    updateAllArrows();
                    renderGames();
                    updateResultCount();
                })
                .catch(function(e) {
                    console.error(e);
                    body.innerHTML = '<tr><td colspan="5"><div class="error-container">Failed to load: ' + e.message + '</div></td></tr>';
                });
            fetch('https://grimcyanide-github-io.vercel.app/api/steam-status?steamid=' + steamId)
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    var dot = document.getElementById('steamStatusDot');
                    var text = document.getElementById('steamStatusText');
                    if (data.online) {
                        dot.className = 'steam-status online';
                        text.textContent = 'online now';
                    } else {
                        dot.className = 'steam-status offline';
                        text.textContent = 'offline';
                    }
                })
                .catch(function() {
                    document.getElementById('steamStatusText').textContent = 'offline';
                });
        }

        function renderStats() {
            var totalGames = allGames.length;
            var totalMinutes = 0;
            allGames.forEach(function(g) { totalMinutes += g.playtime_forever || 0; });
            var totalHours = (totalMinutes / 60).toFixed(0);
            var avgHours = totalGames > 0 ? (totalMinutes / 60 / totalGames).toFixed(1) : '0';
            document.getElementById('statsBar').innerHTML =
                '<div class="stat-item"><div class="stat-value">' + totalGames + '</div><div class="stat-label">Games</div></div>' +
                '<div class="stat-item"><div class="stat-value">' + totalHours + 'h</div><div class="stat-label">Total Playtime</div></div>' +
                '<div class="stat-item"><div class="stat-value">' + avgHours + 'h</div><div class="stat-label">Avg Per Game</div></div>';
        }

        function timeAgo(timestamp) {
            if (!timestamp || timestamp === 0) return 'Never';
            var now = Math.floor(Date.now() / 1000);
            var diff = now - timestamp;
            if (diff < 60) return 'Just now';
            if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
            if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
            if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
            if (diff < 2592000) return Math.floor(diff / 604800) + 'w ago';
            if (diff < 31536000) return Math.floor(diff / 2592000) + 'mo ago';
            return Math.floor(diff / 31536000) + 'y ago';
        }

        function updateAllArrows() {
            Object.keys(columnIds).forEach(function(col) {
                var th = document.getElementById(columnIds[col]);
                if (!th) return;
                var arrow = th.querySelector('.arrow');
                if (!arrow) return;
                th.classList.remove('sorted');
                arrow.textContent = '';
                if (sortDirections[col] === currentSort) {
                    th.classList.add('sorted');
                    if (currentSort.includes('za') || currentSort.includes('asc') || currentSort.includes('oldest')) {
                        arrow.textContent = '▲';
                    } else {
                        arrow.textContent = '▼';
                    }
                }
            });
        }

        function setSort(col) {
            var current = sortDirections[col];
            var next = sortToggles[current];
            sortDirections[col] = next;
            currentSort = next;
            updateAllArrows();
            renderGames();
        }

        function renderGames() {
            var body = document.getElementById('gamesBody');
            var query = document.getElementById('searchInput').value.toLowerCase().trim();
            var sorted = allGames.slice();

            switch (currentSort) {
                case 'name-az': sorted.sort(function(a, b) { return a.name.localeCompare(b.name); }); break;
                case 'name-za': sorted.sort(function(a, b) { return b.name.localeCompare(a.name); }); break;
                case 'playtime-desc': sorted.sort(function(a, b) { return (b.playtime_forever || 0) - (a.playtime_forever || 0); }); break;
                case 'playtime-asc': sorted.sort(function(a, b) { return (a.playtime_forever || 0) - (b.playtime_forever || 0); }); break;
                case 'recent': sorted.sort(function(a, b) { return (b.rtime_last_played || 0) - (a.rtime_last_played || 0); }); break;
                case 'oldest': sorted.sort(function(a, b) { return (a.rtime_last_played || 0) - (b.rtime_last_played || 0); }); break;
            }

            if (query) {
                sorted = sorted.filter(function(g) { return g.name.toLowerCase().indexOf(query) > -1; });
            }

            updateResultCount(sorted.length);

            if (!sorted.length) {
                body.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:48px;color:var(--muted);">No games match.</td></tr>';
                return;
            }

            body.innerHTML = sorted.map(function(g) {
                var hours = (g.playtime_forever / 60).toFixed(1);
                var playtimeText = hours >= 1 ? hours + 'h' : Math.round(g.playtime_forever) + 'm';
                var recentHours = g.playtime_2weeks ? (g.playtime_2weeks / 60).toFixed(1) : 0;
                var recentHtml = recentHours > 0 ? '<span class="game-recent">' + recentHours + 'h recent</span>' : '';
                var lastPlayed = timeAgo(g.rtime_last_played);
                var imgSrc = g.img_icon_url ? 'https://cdn.cloudflare.steamstatic.com/steamcommunity/public/images/apps/' + g.appid + '/' + g.img_icon_url + '.jpg' : '';
                return '<tr>' +
                    '<td>' + (imgSrc ? '<img src="' + imgSrc + '" class="game-logo" loading="lazy" onerror="this.style.display=\'none\'">' : '') + '</td>' +
                    '<td class="game-name"><a onclick="openStorePopup(' + g.appid + ',\'' + escapeHtml(g.name).replace(/'/g, "\\'") + '\')" title="view on Steam store">' + escapeHtml(g.name) + '</a></td>' +
                    '<td class="game-playtime">' + playtimeText + recentHtml + '</td>' +
                    '<td class="game-lastplayed">' + lastPlayed + '</td>' +
                    '<td><button class="ach-btn" onclick="loadAchievements(' + g.appid + ',\'' + escapeHtml(g.name).replace(/'/g, "\\'") + '\')">achievements</button></td>' +
                '</tr>';
            }).join('');
        }

        function openStorePopup(appid, gameName) {
            var overlay = document.getElementById('popupOverlay');
            var inner = document.getElementById('popupInner');
            inner.innerHTML = '<h3>' + gameName + '</h3>' +
                '<p>open this game in the Steam store?</p>' +
                '<div class="popup-buttons">' +
                '<a href="https://store.steampowered.com/app/' + appid + '" target="_blank" class="popup-btn popup-btn-primary">open store page</a>' +
                '<button class="popup-btn popup-btn-secondary" onclick="closePopup()">cancel</button>' +
                '</div>';
            overlay.classList.add('active');
        }

        function loadAchievements(appid, gameName) {
            var overlay = document.getElementById('popupOverlay');
            var inner = document.getElementById('popupInner');
            inner.innerHTML = '<h3>' + gameName + '</h3><div style="text-align:center;padding:20px;color:var(--muted);">Loading achievements...</div>';
            overlay.classList.add('active');
            var url = achApiURL + '?steamid=' + steamId + '&appid=' + appid;
            fetch(url)
                .then(function(r) { if (!r.ok) throw new Error('Failed'); return r.json(); })
                .then(function(data) {
                    if (!data.achievements || !data.achievements.length) {
                        inner.innerHTML = '<h3>' + gameName + '</h3><p style="color:var(--muted);text-align:center;padding:20px;">No achievements available.</p><button class="popup-close" onclick="closePopup()">close</button>';
                        return;
                    }
                    var earned = data.achievements.filter(function(a) { return a.achieved === 1; }).length;
                    var total = data.achievements.length;
                    var pct = Math.round((earned / total) * 100);
                    var html = '<h3>' + gameName + '</h3><div class="ach-summary">' + earned + '/' + total + ' (' + pct + '%)</div>';
                    data.achievements.forEach(function(a) {
                        var unlocked = a.achieved === 1;
                        html += '<div class="ach-row">' +
                            '<span class="ach-icon ' + (unlocked ? 'unlocked' : 'locked') + '">' + (unlocked ? '✓' : '○') + '</span>' +
                            '<div class="ach-info"><div class="ach-name">' + escapeHtml(a.name) + '</div><div class="ach-desc">' + escapeHtml(a.description || '') + '</div></div>' +
                        '</div>';
                    });
                    html += '<button class="popup-close" onclick="closePopup()">close</button>';
                    inner.innerHTML = html;
                })
                .catch(function() {
                    inner.innerHTML = '<h3>' + gameName + '</h3><p style="color:#f85149;text-align:center;padding:20px;">Failed to load achievements.</p><button class="popup-close" onclick="closePopup()">close</button>';
                });
        }

        function closePopup() {
            document.getElementById('popupOverlay').classList.remove('active');
        }

        document.getElementById('popupOverlay').addEventListener('click', function(e) {
            if (e.target === this) closePopup();
        });

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateResultCount(count) {
            var el = document.getElementById('resultCount');
            if (count !== undefined) {
                el.textContent = count + ' of ' + allGames.length + ' games';
            } else {
                el.textContent = allGames.length + ' games';
            }
        }

        document.getElementById('thName').addEventListener('click', function() { setSort('name'); });
        document.getElementById('thPlaytime').addEventListener('click', function() { setSort('playtime'); });
        document.getElementById('thLastPlayed').addEventListener('click', function() { setSort('lastplayed'); });

        var searchTimeout;
        document.getElementById('searchInput').addEventListener('input', function() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(renderGames, 200);
        });

        var themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', function() {
            document.body.classList.toggle('light-mode');
            localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
        });

        loadData();
    </script>
</body>
</html>
