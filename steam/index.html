    <style>

        body.light-mode{--bg:#f3f4f6;--surface:#ffffff;--surface-alt:#f9fafb;--border:#d1d5db;--text:#1f2937;--muted:#6b7280;--accent:#b91c1c;--accent-soft:rgba(185,28,28,0.1);--green:#15803d;--blue:#0969da}
        *{box-sizing:border-box}
        body{background:var(--bg);color:var(--text);font-family:var(--font);margin:0;padding:0;min-height:100vh;transition:background 0.3s,color 0.3s;line-height:1.5;font-size:15px}

        .nav-bar{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

        .card-body{padding:10px 12px}

        @keyframes pulse{0%,100%{opacity:0.4}50%{opacity:0.8}}

        .footer a:hover{color:var(--accent)}
        .popup-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:999;justify-content:center;align-items:flex-start;padding-top:20px}
        .popup-overlay.active{display:flex}

        .popup-meta span{margin-right:20px;font-weight:700;color:var(--text)}
        .popup-desc{font-size:0.9em;color:var(--muted);line-height:1.5;margin-bottom:16px}
        .popup-buttons{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;justify-content:center}
        .popup-btn{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:4px;cursor:pointer;font-family:var(--font);font-size:0.88em;font-weight:600;text-decoration:none;transition:all 0.15s;display:inline-block}
        .popup-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
        .popup-btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
        .popup-btn.primary:hover{opacity:0.85}
        .ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
        .ach-card{background:var(--surface-alt);border:1px solid var(--border);border-radius:6px;padding:10px;text-align:center;transition:border-color 0.15s}
        .ach-card:hover{border-color:var(--accent)}
        .ach-card.locked{opacity:0.4}
        .ach-card img{width:48px;height:48px;border-radius:4px;margin-bottom:6px;display:block;margin-left:auto;margin-right:auto}
        .ach-card .ach-name{font-size:0.7em;font-weight:600;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .popup-close{background:var(--border);border:none;color:var(--text);padding:12px 16px;border-radius:4px;cursor:pointer;margin-top:20px;font-family:var(--font);font-size:0.9em;width:100%}
        .popup-close:hover{background:var(--accent)}
        .popup-inner::-webkit-scrollbar{width:5px}
        .popup-inner::-webkit-scrollbar-track{background:transparent}
        .popup-inner::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
        @media(min-width:1800px){.games-grid{grid-template-columns:repeat(7,1fr)}.games-grid.compact{grid-template-columns:repeat(10,1fr)}}
        @media(max-width:1100px){.games-grid{grid-template-columns:repeat(4,1fr);gap:12px}.games-grid.compact{grid-template-columns:repeat(5,1fr);gap:8px}}
        @media(max-width:860px){.games-grid{grid-template-columns:repeat(3,1fr);gap:10px}.games-grid.compact{grid-template-columns:repeat(4,1fr);gap:8px}.container{padding:16px 0 32px}.card-body{padding:8px 10px}.card-title{font-size:0.78em}.sb-left,.sb-center,.sb-right{font-size:0.72em}.popup-flex{flex-direction:column;align-items:center}.popup-grid-art{width:140px}}
        @media(max-width:600px){.container{width:100%;padding:12px 6px 24px}.games-grid{grid-template-columns:repeat(2,1fr);gap:8px}.games-grid.compact{grid-template-columns:repeat(3,1fr);gap:6px}.filters-section{flex-direction:column;align-items:stretch}.filter-group select,.filter-group input{width:100%;max-width:none}.search-input{max-width:none!important}.sort-group select{width:100%}.nav-bar{padding:8px 12px}.nav-logo{font-size:1em}.nav-link{padding:5px 10px;font-size:0.72em}.popup-inner{padding:18px}.sb-left,.sb-center,.sb-right{font-size:0.65em}.ach-grid{grid-template-columns:repeat(auto-fill,minmax(80px,1fr))}}
    </style>
</head>

    <script>
        var allGames=[],currentSort='playtime',apiURL='https://grimcyanide-github-io.vercel.app/api/steam-games',achApiURL='https://grimcyanide-github-io.vercel.app/api/steam-achievements',steamId='76561198066010654',currentView=5;
        var excludeIds=[629520,1009850,1125480,914690,2687190,1587560,1773890,2776810,1493300,2013900,1446330,2667970,2743080,1471530];
        function renderSkeletons(){var e=document.getElementById('gamesGrid');var t='';for(var o=0;o<20;o++){t+='<div class="game-card skeleton"><div class="card-poster"><div class="skeleton-shimmer"></div></div><div class="card-body"><div class="skeleton-line"></div></div></div>'}e.innerHTML=t}
        renderSkeletons();

        function loadData(){var e=document.getElementById('gamesGrid');fetch(apiURL+'?steamid='+steamId+'&type=owned&t='+Date.now()).then(function(e){if(!e.ok)throw new Error('API returned '+e.status);return e.json()}).then(function(t){if(t.error)throw new Error(t.error);t.games&&t.games.length?(allGames=t.games.filter(function(e){return excludeIds.indexOf(e.appid)===-1}),renderStats(),renderGames(),updateResultCount()):e.innerHTML='<div class="no-results">No games found.</div>'}).catch(function(t){e.innerHTML='<div class="no-results">Failed to load: '+t.message+'</div>'});fetch('https://grimcyanide-github-io.vercel.app/api/steam-status?steamid='+steamId).then(function(e){return e.json()}).then(function(e){var t=document.getElementById('steamDot'),o=document.getElementById('steamStatus');e.online?(t.className='status-dot online',e.game?o.textContent='Currently playing: '+e.game:o.textContent='Online'):(t.className='status-dot offline',o.textContent='Offline')}).catch(function(){document.getElementById('steamStatus').textContent='Offline'})}
        function timeAgo(e){if(!e||0===e)return'Never';var t=Math.floor(Date.now()/1e3),o=t-e;if(o<60)return'Just now';if(o<3600)return Math.floor(o/60)+'m ago';if(o<86400)return Math.floor(o/3600)+'h ago';if(o<604800)return Math.floor(o/86400)+'d ago';if(o<2592e3)return Math.floor(o/604800)+'w ago';if(o<31536e3)return Math.floor(o/2592e3)+'mo ago';return Math.floor(o/31536e3)+'y ago'}

        function getGridUrl(e){return'https://cdn.cloudflare.steamstatic.com/steam/apps/'+e+'/library_600x900.jpg'}

        var currentGameIndexes=[];
        function renderGames(){var e=document.getElementById('gamesGrid'),t=document.getElementById('searchInput').value.toLowerCase().trim(),o=sortGames(allGames,currentSort),n=t?o.filter(function(e){return e.name.toLowerCase().indexOf(t)>-1}):o;updateResultCount(n.length);currentGameIndexes=[];if(!n.length){e.innerHTML='<div class="no-results">No games match.</div>';return}var a='';for(var i=0;i<n.length;i++){var s=n[i];currentGameIndexes.push(allGames.indexOf(s));var l=getGridUrl(s.appid),r=formatPlaytime(s.playtime_forever||0);var d=s.playtime_2weeks?(s.playtime_2weeks/60).toFixed(1):0;var p=d>0?'+'+d+'h':' ';var u=timeAgo(s.rtime_last_played);var h=escapeHtml(s.name),c=escapeHtml(s.name.charAt(0));a+='<div class="game-card" data-idx="'+i+'"><div class="card-poster"><img src="'+l+'" alt="'+h+'" loading="lazy" onerror="var f=this.parentNode;var b=f.querySelector(\'.card-status-bar\')?f.querySelector(\'.card-status-bar\').outerHTML:\'\';f.innerHTML=\'<div class=&quot;poster-fallback&quot;>'+c+'</div>\'+b"><div class="card-status-bar"><span class="sb-left">'+p+'</span><span class="sb-center">'+r+'</span><span class="sb-right">'+u+'</span></div></div><div class="card-body"><div class="card-title">'+h+'</div></div></div>'}e.innerHTML=a;document.querySelectorAll('.game-card').forEach(function(e){e.addEventListener('click',function(){openPopup(parseInt(this.getAttribute('data-idx')))})})}
        function openPopup(e){var t=allGames[currentGameIndexes[e]];var o=document.getElementById('popupOverlay'),n=document.getElementById('popupInner');if(!t){return}var a=formatPlaytime(t.playtime_forever||0);var i=t.playtime_2weeks?(t.playtime_2weeks/60).toFixed(1):'0';var s=timeAgo(t.rtime_last_played);var l=getGridUrl(t.appid);var r=getHeroUrl(t.appid);n.innerHTML='<h2>'+escapeHtml(t.name)+'</h2><img src="'+r+'" alt="" class="popup-hero" onerror="this.style.display=\'none\'"><div class="popup-flex"><img src="'+l+'" alt="'+escapeHtml(t.name)+'" class="popup-grid-art" onerror="this.style.display=\'none\'"><div class="popup-info"><div class="popup-meta"><span>Playtime: '+a+'</span><span>Recent: '+i+'h</span><span>Last played: '+s+'</span></div><div class="popup-desc" id="popupDesc">Loading description...</div></div></div><div class="popup-buttons"><a href="https://store.steampowered.com/app/'+t.appid+'" target="_blank" class="popup-btn primary">Steam Store</a><button class="popup-btn" onclick="loadAchievements('+t.appid+',\''+escapeHtml(t.name).replace(/'/g,"\\'")+'\')">Achievements</button></div><div id="achContainer"></div><button class="popup-close" onclick="closePopup()">close</button>';o.classList.add('active');fetch('https://store.steampowered.com/api/appdetails?appids='+t.appid).then(function(e){return e.json()}).then(function(e){var o=e[t.appid];if(o&&o.success&&o.data){var n=o.data.short_description||'';document.getElementById('popupDesc').textContent=n}}).catch(function(){document.getElementById('popupDesc').textContent=''})}
        function loadAchievements(e,t){var o=document.getElementById('achContainer');o.innerHTML='<div style="text-align:center;padding:12px;color:var(--muted);">Loading achievements...</div>';fetch(achApiURL+'?steamid='+steamId+'&appid='+e).then(function(e){if(!e.ok)throw new Error('Failed');return e.json()}).then(function(e){if(!e.achievements||!e.achievements.length){o.innerHTML='<p style="color:var(--muted);text-align:center;padding:12px;">No achievements available.</p>';return}var t=e.achievements.filter(function(e){return 1===e.achieved}).length,n=e.achievements.length,a=Math.round(t/n*100);var i='<div class="ach-grid">';e.achievements.forEach(function(e){var t=1===e.achieved;var o=t?'':' locked';var n=e.icongray||'';var a=e.icon||'';var s=t&&a?a:n;i+='<div class="ach-card'+o+'"><img src="'+s+'" alt="" loading="lazy" onerror="this.style.display=\'none\'"><div class="ach-name">'+escapeHtml(e.name)+'</div></div>'});i+='</div>';o.innerHTML='<div style="font-weight:700;margin-bottom:8px;font-size:0.95em">Achievements: '+t+'/'+n+' ('+a+'%)</div>'+i}).catch(function(){o.innerHTML='<p style="color:#f85149;text-align:center;padding:12px;">Failed to load achievements.</p>'})}
        function closePopup(){document.getElementById('popupOverlay').classList.remove('active')}
        function escapeHtml(e){var t=document.createElement('div');return t.textContent=e,t.innerHTML}
        function updateResultCount(e){var t=document.getElementById('resultCount');allGames.length&&(void 0!==e?t.textContent=e+' of '+allGames.length+' games':t.textContent=allGames.length+' games')}
        document.getElementById('popupOverlay').addEventListener('click',function(e){e.target===this&&closePopup()});
        document.addEventListener('keydown',function(e){e.key==='Escape'&&closePopup()});
        document.getElementById('sortSelect').addEventListener('change',function(){currentSort=this.value;renderGames()});
        var searchTimeout;document.getElementById('searchInput').addEventListener('input',function(){clearTimeout(searchTimeout),searchTimeout=setTimeout(renderGames,200)});
        var themeToggle=document.getElementById("themeToggle");themeToggle.addEventListener("click",function(){document.body.classList.toggle("light-mode"),localStorage.setItem("theme",document.body.classList.contains("light-mode")?"light":"dark")});
        loadData();
    </script>
