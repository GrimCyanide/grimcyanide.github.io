    <script>
        var allGames=[],currentSort='recent',sortDirections={name:'name-az',playtime:'playtime-desc',lastplayed:'recent'},sortToggles={'name-az':'name-za','name-za':'name-az','playtime-desc':'playtime-asc','playtime-asc':'playtime-desc','recent':'oldest','oldest':'recent'},columnIds={name:'thName',playtime:'thPlaytime',lastplayed:'thLastPlayed'},steamId='76561198066010654',gamesApiURL='https://grimcyanide-github-io.vercel.app/api/steam-games',achApiURL='https://grimcyanide-github-io.vercel.app/api/steam-achievements',excludeIds=[629520,1009850,1125480,914690,2687190,1587560,1773890,2776810,1493300,2013900,1446330,2667970,2743080,1471530];

        function openStorePopup(e,t){var o=document.getElementById('popupOverlay'),n=document.getElementById('popupInner');n.innerHTML='<h3>'+t+'</h3><p>open this game in the Steam store?</p><div class="popup-buttons"><a href="https://store.steampowered.com/app/'+e+'" target="_blank" class="popup-btn popup-btn-primary">open store page</a><button class="popup-btn popup-btn-secondary" onclick="closePopup()">cancel</button></div>',o.classList.add('active')}

    </script>
