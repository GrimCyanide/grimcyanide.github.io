<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VODs & Playthroughs - GRIM_CYANIDE</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="description" content="GRIM_CYANIDE - Complete list of game playthroughs, VODs, and ratings">
    <meta name="keywords" content="grimcyanide, vods, playthroughs, game ratings, gaming, youtube playlists">
    <meta property="og:title" content="VODs & Playthroughs - GRIM_CYANIDE">
    <meta property="og:description" content="Complete list of game playthroughs, VODs, and ratings">
    <meta property="og:image" content="https://grimcyanide.com/android-chrome-512x512.png">
    <meta property="og:url" content="https://grimcyanide.com/vods">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="VODs & Playthroughs - GRIM_CYANIDE">
    <meta name="twitter:description" content="Complete list of game playthroughs, VODs, and ratings">
    <meta name="twitter:image" content="https://grimcyanide.com/android-chrome-512x512.png">
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --muted: #8b949e;
            --accent: #58a6ff;
            --accent-glow: rgba(88, 166, 255, 0.4);
            --green: #3fb950;
            --green-bg: rgba(63, 185, 80, 0.15);
            --amber: #d2991d;
            --amber-bg: rgba(210, 153, 29, 0.15);
            --badge-bg: rgba(48, 54, 61, 0.8);
            --radius: 6px;
            --font: system-ui, -apple-system, 'Segoe UI', sans-serif;
            --mono: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
        }
        body.light-mode {
            --bg: #ffffff;
            --surface: #f6f8fa;
            --border: #d0d7de;
            --text: #1f2328;
            --muted: #656d76;
            --accent: #0969da;
            --accent-glow: rgba(9, 105, 218, 0.3);
            --badge-bg: rgba(208, 215, 222, 0.6);
        }
        * {
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
            line-height: 1.5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 24px;
        }
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .back-link {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.9em;
            font-family: var(--mono);
            transition: color 0.2s;
        }
        .back-link:hover {
            color: var(--accent);
        }
        .header {
            margin-bottom: 28px;
        }
        .header h1 {
            font-size: 2em;
            margin: 0 0 6px 0;
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        .header .subtitle {
            color: var(--muted);
            font-size: 0.95em;
            margin: 0;
        }
        .filters-section {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
            align-items: center;
        }
        .filter-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .filter-group label {
            color: var(--muted);
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            white-space: nowrap;
        }
        .filter-group select,
        .filter-group input {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 8px 12px;
            font-family: var(--font);
            font-size: 0.88em;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
            min-width: 120px;
            cursor: pointer;
        }
        .filter-group select:hover,
        .filter-group input:hover {
            border-color: var(--accent);
        }
        .filter-group select:focus,
        .filter-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .filter-group select option {
            background: var(--surface);
            color: var(--text);
        }
        .search-input {
            min-width: 180px !important;
            flex: 1;
            max-width: 260px;
        }
        .result-count {
            color: var(--muted);
            font-size: 0.82em;
            margin-bottom: 12px;
            font-family: var(--mono);
        }
        .table-wrapper {
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--border);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
            table-layout: fixed;
        }
        thead th {
            background: var(--surface);
            color: var(--muted);
            font-size: 0.78em;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            font-weight: 600;
            padding: 10px 14px;
            text-align: left;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
            border-bottom: 1px solid var(--border);
            transition: color 0.15s;
        }
        thead th:hover {
            color: var(--accent);
        }
        thead th .arrow {
            margin-left: 4px;
            font-size: 0.7em;
            opacity: 0.5;
        }
        thead th.sorted .arrow {
            opacity: 1;
            color: var(--accent);
        }
        tbody td {
            background: var(--surface);
            padding: 12px 14px;
            font-size: 0.88em;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
            word-break: break-word;
        }
        tbody tr:hover td {
            background: var(--badge-bg);
        }
        tbody tr:last-child td {
            border-bottom: none;
        }
        .col-game {
            width: 28%;
        }
        .col-rating {
            width: 13%;
        }
        .col-started {
            width: 14%;
        }
        .col-finished {
            width: 14%;
        }
        .col-parts {
            width: 13%;
        }
        .col-link {
            width: 18%;
        }
        .game-name {
            font-weight: 500;
        }
        .game-rating {
            font-family: var(--mono);
            white-space: nowrap;
        }
        .game-date {
            font-family: var(--mono);
            color: var(--muted);
            font-size: 0.85em;
            white-space: nowrap;
        }
        .game-parts {
            font-family: var(--mono);
            color: var(--muted);
            font-size: 0.85em;
            white-space: nowrap;
        }
        .game-status {
            font-size: 0.78em;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 12px;
            white-space: nowrap;
            display: inline-block;
        }
        .status-finished {
            background: var(--green-bg);
            color: var(--green);
        }
        .status-unfinished {
            background: var(--amber-bg);
            color: var(--amber);
        }
        .game-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.85em;
            white-space: nowrap;
            transition: opacity 0.2s;
        }
        .game-link:hover {
            opacity: 0.7;
            text-decoration: underline;
        }
        .no-results {
            text-align: center;
            color: var(--muted);
            padding: 48px 20px;
            font-size: 0.95em;
        }
        .loading-container {
            text-align: center;
            padding: 48px 20px;
        }
        .loading-spinner {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-text {
            color: var(--muted);
            margin-top: 12px;
            font-size: 0.9em;
        }
        .error-container {
            text-align: center;
            padding: 32px 20px;
            color: #f85149;
            font-size: 0.9em;
        }
        .footer {
            margin-top: 40px;
            color: var(--muted);
            font-size: 0.82em;
            text-align: center;
            font-family: var(--mono);
        }
        .footer a {
            color: var(--muted);
            text-decoration: none;
        }
        .footer a:hover {
            color: var(--accent);
        }
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 26px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 13px;
            transition: .3s;
        }
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background: var(--accent);
            border-radius: 50%;
            transition: .3s;
        }
        input:checked + .toggle-slider:before {
            transform: translateX(22px);
            background: var(--amber);
        }
        @media (max-width: 860px) {
            table {
                min-width: 700px;
            }
            thead th {
                font-size: 0.7em;
                padding: 8px 8px;
            }
            tbody td {
                font-size: 0.8em;
                padding: 10px 8px;
            }
            .col-game { width: 24%; }
            .col-rating { width: 12%; }
            .col-started { width: 13%; }
            .col-finished { width: 13%; }
            .col-parts { width: 14%; }
            .col-link { width: 24%; }
        }
        @media (max-width: 600px) {
            .filters-section {
                flex-direction: column;
                align-items: stretch;
            }
            .filter-group select,
            .filter-group input {
                width: 100%;
                max-width: none;
            }
            .search-input {
                max-width: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="theme-toggle">
        <label class="toggle-switch">
            <input type="checkbox" id="themeToggle">
            <span class="toggle-slider"></span>
        </label>
    </div>
    <div class="container">
        <div class="top-bar">
            <a href="https://grimcyanide.com" class="back-link">← grimcyanide.com</a>
        </div>
        <div class="header">
            <h1>VODs &amp; Playthroughs</h1>
            <p class="subtitle">Every game played, rated and catalogued.</p>
        </div>
        <div class="filters-section">
            <div class="filter-group">
                <label for="statusFilter">Status</label>
                <select id="statusFilter">
                    <option value="all">All</option>
                    <option value="Finished">Finished</option>
                    <option value="Unfinished">Unfinished</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="searchInput">Search</label>
                <input type="text" id="searchInput" class="search-input" placeholder="Filter games...">
            </div>
        </div>
        <div class="result-count" id="resultCount"></div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th class="col-game sorted" data-sort="az" id="thGame">Game <span class="arrow">▼</span></th>
                        <th class="col-rating" data-sort="rating-high" id="thRating">Rating <span class="arrow"></span></th>
                        <th class="col-started" data-sort="recent-started" id="thStarted">Started <span class="arrow"></span></th>
                        <th class="col-finished" data-sort="recent-finished" id="thFinished">Finished <span class="arrow"></span></th>
                        <th class="col-parts" data-sort="parts-high" id="thParts">Parts <span class="arrow"></span></th>
                        <th class="col-link" id="thLink">Link</th>
                    </tr>
                </thead>
                <tbody id="gamesBody">
                    <tr>
                        <td colspan="6">
                            <div class="loading-container">
                                <div class="loading-spinner"></div>
                                <p class="loading-text">Loading...</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="footer">
            © 2026 <a href="https://grimcyanide.com">grimcyanide.com</a>
        </div>
    </div>
    <script>
        let allGames = [];
        let currentSort = 'az';
        let sortDirection = {};
        const sortDefaults = {
            game: 'az',
            rating: 'rating-high',
            started: 'recent-started',
            finished: 'recent-finished',
            parts: 'parts-high'
        };
        const sortToggles = {
            'az': 'za',
            'za': 'az',
            'rating-high': 'rating-low',
            'rating-low': 'rating-high',
            'recent-started': 'oldest-started',
            'oldest-started': 'recent-started',
            'recent-finished': 'oldest-finished',
            'oldest-finished': 'recent-finished',
            'parts-high': 'parts-low',
            'parts-low': 'parts-high'
        };
        async function loadGamesData() {
            const body = document.getElementById('gamesBody');
            try {
                const response = await fetch('https://grimcyanide-github-io.vercel.app/api/vods-sheet');
                if (!response.ok) throw new Error('API returned ' + response.status);
                const data = await response.json();
                if (data.error) throw new Error(data.error);
                if (!data.games || data.games.length === 0) {
                    body.innerHTML = '<tr><td colspan="6"><div class="no-results">No games found.</div></td></tr>';
                    return;
                }
                allGames = data.games;
                currentSort = 'az';
                sortDirection = { game: 'az', rating: 'rating-high', started: 'recent-started', finished: 'recent-finished', parts: 'parts-high' };
                updateSortIndicator('game');
                renderGames();
                updateResultCount();
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('gamesBody').innerHTML = '<tr><td colspan="6"><div class="error-container">Failed to load data. ' + error.message + '</div></td></tr>';
            }
        }
        function parseDate(dateStr) {
            if (!dateStr) return null;
            const dmyMatch = dateStr.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
            if (dmyMatch) return new Date(dmyMatch[3], dmyMatch[2] - 1, dmyMatch[1]);
            const parsed = new Date(dateStr);
            if (!isNaN(parsed.getTime())) return parsed;
            return null;
        }
        function sortGames(games, sortBy) {
            const sorted = [...games];
            switch (sortBy) {
                case 'az': return sorted.sort((a, b) => a.game.localeCompare(b.game));
                case 'za': return sorted.sort((a, b) => b.game.localeCompare(a.game));
                case 'recent-started': return sorted.sort((a, b) => { const dA = parseDate(a.dateStarted), dB = parseDate(b.dateStarted); if (!dA && !dB) return 0; if (!dA) return 1; if (!dB) return -1; return dB - dA; });
                case 'oldest-started': return sorted.sort((a, b) => { const dA = parseDate(a.dateStarted), dB = parseDate(b.dateStarted); if (!dA && !dB) return 0; if (!dA) return 1; if (!dB) return -1; return dA - dB; });
                case 'recent-finished': return sorted.sort((a, b) => { const dA = parseDate(a.dateFinished), dB = parseDate(b.dateFinished); if (!dA && !dB) return 0; if (!dA) return 1; if (!dB) return -1; return dB - dA; });
                case 'oldest-finished': return sorted.sort((a, b) => { const dA = parseDate(a.dateFinished), dB = parseDate(b.dateFinished); if (!dA && !dB) return 0; if (!dA) return 1; if (!dB) return -1; return dA - dB; });
                case 'rating-high': return sorted.sort((a, b) => b.rating - a.rating);
                case 'rating-low': return sorted.sort((a, b) => a.rating - b.rating);
                case 'parts-high': return sorted.sort((a, b) => b.parts - a.parts);
                case 'parts-low': return sorted.sort((a, b) => a.parts - b.parts);
                default: return sorted;
            }
        }
        function filterGames(games, statusFilter, searchQuery) {
            let filtered = games;
            if (statusFilter !== 'all') filtered = filtered.filter(g => g.isFinished === statusFilter);
            if (searchQuery.trim()) {
                const q = searchQuery.toLowerCase().trim();
                filtered = filtered.filter(g => g.game.toLowerCase().includes(q));
            }
            return filtered;
        }
        function formatParts(partsDisplay, parts) {
            if (partsDisplay) {
                let text = partsDisplay;
                if (text.toLowerCase().includes('so far')) {
                    text = text.replace(/so far/i, '').trim();
                    if (!text.toLowerCase().includes('part')) text = text + (text ? ' parts so far' : 'parts so far');
                    else text = text + ' so far';
                } else if (!text.toLowerCase().includes('part')) {
                    text = text + ' part' + (parts !== 1 ? 's' : '');
                }
                return text;
            }
            return parts + ' part' + (parts !== 1 ? 's' : '');
        }
        function updateSortIndicator(column) {
            document.querySelectorAll('thead th').forEach(th => {
                th.classList.remove('sorted');
                th.querySelector('.arrow').textContent = '';
            });
            const th = document.getElementById('th' + column.charAt(0).toUpperCase() + column.slice(1));
            if (th) {
                th.classList.add('sorted');
                const dir = sortDirection[column];
                if (dir && (dir.includes('high') || dir.includes('za') || dir.includes('recent') || dir.includes('az') || dir.includes('oldest'))) {
                    const arrow = th.querySelector('.arrow');
                    if (dir.includes('low') || dir.includes('za') || dir.includes('oldest')) arrow.textContent = '▲';
                    else arrow.textContent = '▼';
                }
            }
        }
        function setSort(column) {
            const current = sortDirection[column];
            const next = sortToggles[current] || sortDefaults[column];
            sortDirection[column] = next;
            for (const key in sortDirection) {
                if (key !== column) sortDirection[key] = sortDefaults[key];
            }
            currentSort = next;
            updateSortIndicator(column);
            renderGames();
        }
        function renderGames() {
            const body = document.getElementById('gamesBody');
            const statusFilter = document.getElementById('statusFilter').value;
            const searchQuery = document.getElementById('searchInput').value;
            let sorted = sortGames(allGames, currentSort);
            let filtered = filterGames(sorted, statusFilter, searchQuery);
            updateResultCount(filtered.length);
            if (filtered.length === 0) {
                body.innerHTML = '<tr><td colspan="6"><div class="no-results">No games match.</div></td></tr>';
                return;
            }
            body.innerHTML = filtered.map(g => {
                const statusClass = g.isFinished === 'Finished' ? 'status-finished' : 'status-unfinished';
                const partsText = formatParts(g.partsDisplay, g.parts);
                const ratingText = g.rating && g.rating > 0 ? g.rating + '/10' : '—';
                const linkHtml = g.linkUrl ? '<a href="' + escapeHtml(g.linkUrl) + '" target="_blank" rel="noopener" class="game-link">▶ ' + escapeHtml(g.linkText || 'Watch') + '</a>' : '<span style="color:var(--muted);font-size:0.85em;">—</span>';
                return '<tr>' +
                    '<td><span class="game-name">' + escapeHtml(g.game) + '</span></td>' +
                    '<td><span class="game-rating">' + ratingText + '</span></td>' +
                    '<td><span class="game-date">' + (g.dateStarted || '?') + '</span></td>' +
                    '<td><span class="game-date">' + (g.dateFinished || '—') + '</span></td>' +
                    '<td><span class="game-parts">' + partsText + '</span></td>' +
                    '<td>' + linkHtml + '</td>' +
                '</tr>';
            }).join('');
        }
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        function updateResultCount(filteredCount) {
            const el = document.getElementById('resultCount');
            if (!allGames.length) return;
            if (filteredCount !== undefined) el.textContent = filteredCount + ' of ' + allGames.length + ' games';
            else el.textContent = allGames.length + ' games';
        }
        document.getElementById('thGame').addEventListener('click', function() { setSort('game'); });
        document.getElementById('thRating').addEventListener('click', function() { setSort('rating'); });
        document.getElementById('thStarted').addEventListener('click', function() { setSort('started'); });
        document.getElementById('thFinished').addEventListener('click', function() { setSort('finished'); });
        document.getElementById('thParts').addEventListener('click', function() { setSort('parts'); });
        document.getElementById('statusFilter').addEventListener('change', renderGames);
        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', function() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(renderGames, 200);
        });
        const themeToggle = document.getElementById('themeToggle');
        const currentTheme = localStorage.getItem('theme');
        if (currentTheme === 'light') {
            document.body.classList.add('light-mode');
            themeToggle.checked = true;
        }
        themeToggle.addEventListener('change', function() {
            if (this.checked) {
                document.body.classList.add('light-mode');
                localStorage.setItem('theme', 'light');
            } else {
                document.body.classList.remove('light-mode');
                localStorage.setItem('theme', 'dark');
            }
        });
        loadGamesData();
    </script>
</body>
</html>
