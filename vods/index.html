<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VODs & Playthroughs - GRIM_CYANIDE</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="description" content="GRIM_CYANIDE - Complete list of game playthroughs, VODs, and ratings">
    <meta name="keywords" content="grimcyanide, vods, playthroughs, game ratings, gaming, youtube playlists">
    <meta property="og:title" content="VODs & Playthroughs - GRIM_CYANIDE">
    <meta property="og:description" content="Complete list of game playthroughs, VODs, and ratings">
    <meta property="og:image" content="https://grimcyanide.com/android-chrome-512x512.png">
    <meta property="og:url" content="https://grimcyanide.com/vods">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="VODs & Playthroughs - GRIM_CYANIDE">
    <meta name="twitter:description" content="Complete list of game playthroughs, VODs, and ratings">
    <meta name="twitter:image" content="https://grimcyanide.com/android-chrome-512x512.png">
    <style>
        :root {
            --bg: #0a0a0a;
            --text: #00ffff;
            --text-secondary: #88ffff;
            --text-muted: #008888;
            --border: #004444;
            --border-hover: #00ffff;
            --card-bg: rgba(0, 255, 255, 0.05);
            --card-hover-bg: rgba(0, 255, 255, 0.1);
            --glow: rgba(0, 255, 255, 0.3);
            --glow-hover: rgba(0, 255, 255, 0.5);
            --badge-bg: rgba(0, 100, 100, 0.3);
            --badge-border: #008888;
            --badge-text: #00cccc;
            --finished-glow: rgba(0, 255, 100, 0.3);
            --finished-text: #00ff64;
            --unfinished-glow: rgba(255, 180, 0, 0.3);
            --unfinished-text: #ffb400;
            --select-bg: rgba(0, 255, 255, 0.1);
            --scrollbar-track: #001a1a;
            --scrollbar-thumb: #00ffff;
            --scrollbar-thumb-hover: #00cccc;
        }
        body.light-mode {
            --bg: #e6f2f2 !important;
            --text: #004444 !important;
            --text-secondary: #002222 !important;
            --text-muted: #556666 !important;
            --border: #000000 !important;
            --border-hover: #000000 !important;
            --card-bg: rgba(200, 200, 200, 0.9) !important;
            --card-hover-bg: rgba(180, 180, 180, 0.9) !important;
            --glow: rgba(0, 0, 0, 0.2) !important;
            --glow-hover: rgba(0, 0, 0, 0.3) !important;
            --badge-bg: rgba(100, 100, 100, 0.3) !important;
            --badge-border: #666666 !important;
            --badge-text: #001111 !important;
            --finished-text: #006622 !important;
            --finished-glow: rgba(0, 100, 30, 0.2) !important;
            --unfinished-text: #996600 !important;
            --unfinished-glow: rgba(150, 100, 0, 0.2) !important;
            --select-bg: rgba(200, 200, 200, 0.9) !important;
            --scrollbar-track: #b8d8d8 !important;
            --scrollbar-thumb: #000000 !important;
            --scrollbar-thumb-hover: #333333 !important;
        }
        * {
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            transition: all 0.3s ease;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 3em;
            margin: 0;
            text-shadow: 0 0 12px var(--text), 0 0 24px var(--text);
            letter-spacing: 3px;
            font-weight: normal;
        }
        .header .subtitle {
            color: var(--text-muted);
            font-size: 1em;
            margin-top: 10px;
        }
        .back-link {
            display: inline-block;
            color: var(--text);
            text-decoration: none;
            border: 1px solid var(--border);
            padding: 8px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            font-size: 0.9em;
        }
        .back-link:hover {
            background: var(--card-bg);
            border-color: var(--border-hover);
            transform: translateY(-2px);
        }
        .filters-section {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
            align-items: center;
            justify-content: center;
        }
        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .filter-group label {
            color: var(--text-muted);
            font-size: 0.85em;
            white-space: nowrap;
        }
        .filter-group select,
        .filter-group input {
            background: var(--select-bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            outline: none;
            transition: all 0.3s ease;
            min-width: 140px;
            cursor: pointer;
        }
        .filter-group select:hover,
        .filter-group input:hover {
            border-color: var(--border-hover);
        }
        .filter-group select:focus,
        .filter-group input:focus {
            border-color: var(--border-hover);
            box-shadow: 0 0 10px var(--glow);
        }
        .filter-group select option {
            background: #0a0a0a;
            color: #00ffff;
        }
        body.light-mode .filter-group select option {
            background: #e6f2f2;
            color: #004444;
        }
        .search-input {
            min-width: 200px !important;
            flex: 1;
            max-width: 300px;
        }
        .result-count {
            color: var(--text-muted);
            font-size: 0.85em;
            text-align: center;
            margin-bottom: 20px;
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }
        @media (max-width: 400px) {
            .games-grid {
                grid-template-columns: 1fr;
            }
        }
        .game-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
            position: relative;
            overflow: hidden;
            height: 100%;
        }
        .game-card:hover {
            border-color: var(--border-hover);
            background: var(--card-hover-bg);
            transform: translateY(-4px);
            box-shadow: 0 8px 30px var(--glow-hover);
        }
        .game-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            gap: 10px;
            min-height: 44px;
        }
        .game-title {
            font-weight: bold;
            font-size: 1.1em;
            color: var(--text-secondary);
            line-height: 1.3;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .status-badge {
            font-size: 0.7em;
            padding: 3px 8px;
            border-radius: 10px;
            white-space: nowrap;
            font-weight: bold;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }
        .status-finished {
            background: rgba(0, 255, 100, 0.1);
            border: 1px solid var(--finished-text);
            color: var(--finished-text);
            box-shadow: 0 0 8px var(--finished-glow);
        }
        .status-unfinished {
            background: rgba(255, 180, 0, 0.1);
            border: 1px solid var(--unfinished-text);
            color: var(--unfinished-text);
            box-shadow: 0 0 8px var(--unfinished-glow);
        }
        .game-card-body {
            flex: 1;
            margin-bottom: 15px;
        }
        .game-detail {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            font-size: 0.85em;
            height: 24px;
        }
        .game-detail .detail-label {
            color: var(--text-muted);
            min-width: 70px;
            font-size: 0.8em;
            white-space: nowrap;
        }
        .game-detail .detail-value {
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .rating-stars {
            color: #ffcc00;
            letter-spacing: 2px;
            text-shadow: 0 0 6px rgba(255, 204, 0, 0.5);
            white-space: nowrap;
        }
        .game-card-footer {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: auto;
        }
        .link-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: var(--badge-bg);
            color: var(--badge-text);
            border: 1px solid var(--badge-border);
            border-radius: 8px;
            padding: 10px 16px;
            text-decoration: none;
            font-size: 0.85em;
            font-weight: bold;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            flex: 1;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .link-button:hover {
            background: var(--card-hover-bg);
            border-color: var(--border-hover);
            color: var(--text);
            box-shadow: 0 0 15px var(--glow);
            transform: translateY(-1px);
        }
        .link-button:active {
            transform: translateY(0);
        }
        .parts-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--badge-bg);
            border: 1px solid var(--badge-border);
            color: var(--badge-text);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.85em;
            font-weight: bold;
            white-space: nowrap;
            min-width: 50px;
            text-align: center;
            flex-shrink: 0;
        }
        .no-results {
            text-align: center;
            color: var(--text-muted);
            font-style: italic;
            padding: 60px 20px;
            grid-column: 1 / -1;
            font-size: 1.1em;
        }
        .loading-container {
            text-align: center;
            padding: 60px 20px;
            grid-column: 1 / -1;
        }
        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--text);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-text {
            color: var(--text-muted);
            margin-top: 15px;
        }
        .error-container {
            text-align: center;
            padding: 40px 20px;
            grid-column: 1 / -1;
            color: #ff4444;
            border: 1px solid #ff4444;
            border-radius: 12px;
            background: rgba(255, 60, 60, 0.05);
        }
        .footer {
            margin-top: 50px;
            color: var(--text-muted);
            font-size: 0.9em;
            padding-top: 20px;
            text-align: center;
            border-top: 1px solid var(--border);
        }
        .footer a {
            color: var(--text);
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 30px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 255, 255, 0.2);
            border: 1px solid #00ffff;
            border-radius: 15px;
            transition: .4s;
        }
        .toggle-slider:before {
            position: absolute;
            content: "🌙";
            height: 22px;
            width: 22px;
            left: 4px;
            bottom: 3px;
            background: #00ffff;
            border-radius: 50%;
            transition: .4s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        input:checked + .toggle-slider {
            background: rgba(0, 136, 136, 0.2);
            border: 1px solid #008888;
        }
        input:checked + .toggle-slider:before {
            content: "☀️";
            transform: translateX(30px);
            background: #008888;
        }
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }
            .filters-section {
                flex-direction: column;
                align-items: stretch;
            }
            .filter-group {
                flex-direction: column;
                align-items: stretch;
            }
            .filter-group select,
            .filter-group input {
                width: 100%;
                max-width: none;
            }
            .search-input {
                max-width: none !important;
            }
            .games-grid {
                grid-template-columns: 1fr;
            }
            .theme-toggle {
                top: 10px;
                right: 10px;
            }
        }
        @media (max-width: 480px) {
            .container {
                padding: 20px 10px;
            }
            .header h1 {
                font-size: 1.6em;
            }
            .game-card {
                padding: 15px;
            }
            .game-card-footer {
                flex-direction: column;
            }
            .link-button,
            .parts-badge {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="theme-toggle">
        <label class="toggle-switch">
            <input type="checkbox" id="themeToggle">
            <span class="toggle-slider"></span>
        </label>
    </div>
    <div class="container">
        <a href="https://grimcyanide.com" class="back-link">← Back to GRIM_CYANIDE</a>
        <div class="header">
            <h1>VODS & PLAYTHROUGHS</h1>
            <p class="subtitle">Every game I've played, rated and catalogued</p>
        </div>
        <div class="filters-section">
            <div class="filter-group">
                <label for="sortBy">Sort:</label>
                <select id="sortBy">
                    <option value="az">A → Z</option>
                    <option value="za">Z → A</option>
                    <option value="recent-started">Recently Started</option>
                    <option value="oldest-started">Least Recently Started</option>
                    <option value="recent-finished">Recently Finished</option>
                    <option value="oldest-finished">Least Recently Finished</option>
                    <option value="rating-high">Highest Rated</option>
                    <option value="rating-low">Lowest Rated</option>
                    <option value="parts-high">Most Parts</option>
                    <option value="parts-low">Least Parts</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="statusFilter">Status:</label>
                <select id="statusFilter">
                    <option value="all">All Games</option>
                    <option value="Finished">✓ Finished</option>
                    <option value="Unfinished">✗ Unfinished</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="searchInput">Search:</label>
                <input type="text" id="searchInput" class="search-input" placeholder="Search games...">
            </div>
        </div>
        <div class="result-count" id="resultCount"></div>
        <div class="games-grid" id="gamesGrid">
            <div class="loading-container">
                <div class="loading-spinner"></div>
                <p class="loading-text">Loading playthrough data...</p>
            </div>
        </div>
        <div class="footer">
            © 2026 <a href="https://grimcyanide.com">grimcyanide.com</a> — Data synced from my personal game tracking sheet
        </div>
    </div>
    <script>
        let allGames = [];
        async function loadGamesData() {
            const grid = document.getElementById('gamesGrid');
            try {
                const response = await fetch('https://grimcyanide-github-io.vercel.app/api/vods-sheet');
                if (!response.ok) throw new Error(`API returned ${response.status}`);
                const data = await response.json();
                if (data.error) throw new Error(data.error);
                if (!data.games || data.games.length === 0) {
                    grid.innerHTML = '<div class="no-results">No games found in the sheet. Add some games and check back!</div>';
                    return;
                }
                allGames = data.games;
                renderGames();
                updateResultCount();
            } catch (error) {
                console.error('Error loading games:', error);
                grid.innerHTML = '<div class="error-container"><p>⚠️ Failed to load game data</p><p style="font-size: 0.85em;">' + error.message + '</p><p style="font-size: 0.8em;">Check the console for details or try refreshing.</p></div>';
            }
        }
        function parseDate(dateStr) {
            if (!dateStr) return null;
            const dmyMatch = dateStr.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
            if (dmyMatch) return new Date(dmyMatch[3], dmyMatch[2] - 1, dmyMatch[1]);
            const parsed = new Date(dateStr);
            if (!isNaN(parsed.getTime())) return parsed;
            return null;
        }
        function sortGames(games, sortBy) {
            const sorted = [...games];
            switch (sortBy) {
                case 'az': return sorted.sort((a, b) => a.game.localeCompare(b.game));
                case 'za': return sorted.sort((a, b) => b.game.localeCompare(a.game));
                case 'recent-started': return sorted.sort((a, b) => { const dA = parseDate(a.dateStarted), dB = parseDate(b.dateStarted); if (!dA && !dB) return 0; if (!dA) return 1; if (!dB) return -1; return dB - dA; });
                case 'oldest-started': return sorted.sort((a, b) => { const dA = parseDate(a.dateStarted), dB = parseDate(b.dateStarted); if (!dA && !dB) return 0; if (!dA) return 1; if (!dB) return -1; return dA - dB; });
                case 'recent-finished': return sorted.sort((a, b) => { const dA = parseDate(a.dateFinished), dB = parseDate(b.dateFinished); if (!dA && !dB) return 0; if (!dA) return 1; if (!dB) return -1; return dB - dA; });
                case 'oldest-finished': return sorted.sort((a, b) => { const dA = parseDate(a.dateFinished), dB = parseDate(b.dateFinished); if (!dA && !dB) return 0; if (!dA) return 1; if (!dB) return -1; return dA - dB; });
                case 'rating-high': return sorted.sort((a, b) => b.rating - a.rating);
                case 'rating-low': return sorted.sort((a, b) => a.rating - b.rating);
                case 'parts-high': return sorted.sort((a, b) => b.parts - a.parts);
                case 'parts-low': return sorted.sort((a, b) => a.parts - b.parts);
                default: return sorted;
            }
        }
        function filterGames(games, statusFilter, searchQuery) {
            let filtered = games;
            if (statusFilter !== 'all') filtered = filtered.filter(game => game.isFinished === statusFilter);
            if (searchQuery.trim()) {
                const query = searchQuery.toLowerCase().trim();
                filtered = filtered.filter(game => game.game.toLowerCase().includes(query));
            }
            return filtered;
        }
        function renderStars(rating) {
            if (!rating || rating === 0) return '<span style="color: var(--text-muted);">N/A</span>';
            const fullStars = Math.floor(rating);
            const halfStar = rating % 1 >= 0.5;
            const emptyStars = 10 - fullStars - (halfStar ? 1 : 0);
            let stars = '';
            for (let i = 0; i < fullStars; i++) stars += '★';
            if (halfStar) stars += '⯪';
            for (let i = 0; i < emptyStars; i++) stars += '☆';
            return '<span class="rating-stars">' + stars + '</span> <span style="color: var(--text-secondary); margin-left: 4px;">' + rating + '/10</span>';
        }
        function formatParts(partsDisplay, parts) {
            if (partsDisplay) {
                let text = partsDisplay;
                if (text.toLowerCase().includes('so far')) {
                    text = text.replace(/so far/i, '').trim();
                    if (!text.toLowerCase().includes('part')) text = text + (text ? ' parts so far' : 'parts so far');
                    else text = text + ' so far';
                } else if (!text.toLowerCase().includes('part')) {
                    text = text + ' part' + (parts !== 1 ? 's' : '');
                }
                return text;
            }
            return parts + ' part' + (parts !== 1 ? 's' : '');
        }
        function renderGames() {
            const grid = document.getElementById('gamesGrid');
            const sortBy = document.getElementById('sortBy').value;
            const statusFilter = document.getElementById('statusFilter').value;
            const searchQuery = document.getElementById('searchInput').value;
            let sorted = sortGames(allGames, sortBy);
            let filtered = filterGames(sorted, statusFilter, searchQuery);
            updateResultCount(filtered.length);
            if (filtered.length === 0) {
                grid.innerHTML = '<div class="no-results">No games match your filters. Try adjusting them!</div>';
                return;
            }
            grid.innerHTML = filtered.map(game => {
                const statusText = game.isFinished === 'Finished' ? '✓ Finished' : '✗ Unfinished';
                const partsText = formatParts(game.partsDisplay, game.parts);
                return '<div class="game-card">' +
                    '<div class="game-card-header">' +
                        '<span class="game-title">' + escapeHtml(game.game) + '</span>' +
                        '<span class="status-badge ' + (game.isFinished === 'Finished' ? 'status-finished' : 'status-unfinished') + '">' + statusText + '</span>' +
                    '</div>' +
                    '<div class="game-card-body">' +
                        '<div class="game-detail">' +
                            '<span class="detail-label">Rating:</span>' +
                            '<span class="detail-value">' + renderStars(game.rating) + '</span>' +
                        '</div>' +
                        '<div class="game-detail">' +
                            '<span class="detail-label">Started:</span>' +
                            '<span class="detail-value">' + (game.dateStarted || 'Unknown') + '</span>' +
                        '</div>' +
                        '<div class="game-detail">' +
                            '<span class="detail-label">Finished:</span>' +
                            '<span class="detail-value">' + (game.dateFinished || '—') + '</span>' +
                        '</div>' +
                    '</div>' +
                    '<div class="game-card-footer">' +
                        (game.linkUrl ? '<a href="' + escapeHtml(game.linkUrl) + '" target="_blank" rel="noopener" class="link-button" onclick="event.stopPropagation();">▶ ' + escapeHtml(game.linkText) + '</a>' : '<span class="link-button" style="opacity: 0.5; cursor: default;">No Link</span>') +
                        '<span class="parts-badge">' + partsText + '</span>' +
                    '</div>' +
                '</div>';
            }).join('');
        }
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        function updateResultCount(filteredCount) {
            const countEl = document.getElementById('resultCount');
            if (!allGames.length) return;
            if (filteredCount !== undefined) countEl.textContent = 'Showing ' + filteredCount + ' of ' + allGames.length + ' game' + (allGames.length !== 1 ? 's' : '');
            else countEl.textContent = allGames.length + ' game' + (allGames.length !== 1 ? 's' : '') + ' tracked';
        }
        document.getElementById('sortBy').addEventListener('change', renderGames);
        document.getElementById('statusFilter').addEventListener('change', renderGames);
        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', function() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(renderGames, 200);
        });
        const themeToggle = document.getElementById('themeToggle');
        const currentTheme = localStorage.getItem('theme');
        if (currentTheme === 'light') {
            document.body.classList.add('light-mode');
            themeToggle.checked = true;
        }
        themeToggle.addEventListener('change', function() {
            if (this.checked) {
                document.body.classList.add('light-mode');
                localStorage.setItem('theme', 'light');
            } else {
                document.body.classList.remove('light-mode');
                localStorage.setItem('theme', 'dark');
            }
        });
        loadGamesData();
    </script>
</body>
</html>
