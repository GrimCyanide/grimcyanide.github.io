    <style>
        :root{--bg:#0b0e11;--surface:#14181d;--surface-alt:#181c22;--border:#252a30;--text:#c8cdd2;--muted:#6b7280;--accent:#e85d75;--accent-soft:rgba(232,93,117,0.15);--amber:#d2991d;--badge-bg:rgba(48,54,61,0.8);--radius:6px;--font:system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'SF Mono','Cascadia Code','Fira Code',monospace}
        body.light-mode{--bg:#f3f4f6;--surface:#ffffff;--surface-alt:#f9fafb;--border:#d1d5db;--text:#1f2937;--muted:#6b7280;--accent:#b91c1c;--accent-soft:rgba(185,28,28,0.1);--amber:#92400e;--badge-bg:rgba(209,213,219,0.6)}
        *{box-sizing:border-box}

        html{overflow-y:scroll;scrollbar-gutter:stable}
        .nav-bar{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

        .nav-logo{font-weight:700;font-size:1.1em;color:var(--accent);text-decoration:none;letter-spacing:-0.5px}
        .nav-links{display:flex;gap:4px;flex-wrap:wrap}

        .nav-link:hover{border-color:var(--border);color:var(--text)}
        .nav-link.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
        .nav-right{display:flex;align-items:center;gap:10px}
        .theme-toggle{background:none;border:1px solid var(--border);border-radius:4px;color:var(--muted);font-family:var(--font);font-size:0.7em;padding:4px 8px;cursor:pointer;transition:all 0.15s}
        .theme-toggle:hover{border-color:var(--accent);color:var(--text)}
        .container{max-width:1100px;margin:0 auto;padding:24px 24px 40px}
        .header{text-align:center;margin-bottom:24px}
        .header h1{font-size:2em;margin:0 0 4px 0;font-weight:700;letter-spacing:-0.5px}

        .search-input{min-width:180px!important;flex:1;max-width:260px}

        thead th{background:var(--surface);color:var(--muted);font-size:0.78em;text-transform:uppercase;letter-spacing:0.5px;font-weight:600;padding:10px 8px;text-align:center;cursor:pointer;user-select:none;white-space:nowrap;border-bottom:1px solid var(--border);transition:color 0.15s}
        thead th:hover{color:var(--accent)}

        thead th.sorted{color:var(--accent)}
        thead th.sorted .arrow{opacity:1;color:var(--accent)}

    </style>

<body data-view-transition="vods">
    <nav class="nav-bar">
        <div class="nav-left"><a href="/" class="nav-logo">GRIM_CYANIDE</a></div>
        <div class="nav-links"><a href="/" class="nav-link">Home</a><a href="/vods" class="nav-link active">VODs &amp; Ratings</a><a href="/steam" class="nav-link">Steam Games</a></div>
        <div class="nav-right"><button class="theme-toggle" id="themeToggle">light/dark</button></div>
    </nav>
    <div class="container">
        <div class="header"><h1>VODs &amp; Playthroughs</h1><p class="subtitle">Every game played, rated and catalogued.</p></div>
        <div class="filters-section">
            <div class="filter-group"><label for="statusFilter">Status</label><select id="statusFilter"><option value="all">All</option><option value="Finished">Finished</option><option value="Unfinished">Unfinished</option></select></div>
            <div class="filter-group"><label for="searchInput">Search</label><input type="text" id="searchInput" class="search-input" placeholder="Filter games..."></div>
        </div>
        <div class="result-count" id="resultCount"></div>
        <div class="table-wrapper"><table><thead><tr><th style="width:32%" data-col="game" id="thGame">Game <span class="arrow"></span></th><th style="width:13%" data-col="rating" id="thRating">Rating <span class="arrow"></span></th><th style="width:16%" class="sorted" data-col="started" id="thStarted">Started <span class="arrow">▼</span></th><th style="width:16%" data-col="finished" id="thFinished">Finished <span class="arrow"></span></th><th style="width:23%" id="thLink">Link</th></tr></thead><tbody id="gamesBody"><tr><td colspan="5"><div class="loading-container"><div class="loading-spinner"></div><p class="loading-text">Loading...</p></div></td></tr></tbody></table></div>
        <div class="footer">© 2026 <a href="https://grimcyanide.com">grimcyanide.com</a></div>
    </div>
    <script>
        var allGames=[],currentSort='recent-started',sortDirections={game:'az',rating:'rating-high',started:'recent-started',finished:'recent-finished'},sortToggles={'az':'za','za':'az','rating-high':'rating-low','rating-low':'rating-high','recent-started':'oldest-started','oldest-started':'recent-started','recent-finished':'oldest-finished','oldest-finished':'recent-finished'},columnIds=['game','rating','started','finished'],apiURL='https://grimcyanide-github-io.vercel.app/api/vods-sheet';
        function loadGamesData(){var e=document.getElementById('gamesBody'),t=apiURL+'?t='+Date.now();fetch(t).then(function(e){if(!e.ok)throw new Error('API returned '+e.status);return e.json()}).then(function(t){if(t.error)throw new Error(t.error);t.games&&t.games.length?(allGames=t.games,currentSort='recent-started',sortDirections={game:'az',rating:'rating-high',started:'recent-started',finished:'recent-finished'},updateAllArrows(),renderGames(),updateResultCount()):e.innerHTML='<tr><td colspan="5"><div class="no-results">No games found.</div></td></tr>'}).catch(function(t){console.error('Error:',t),e.innerHTML='<tr><td colspan="5"><div class="error-container">Failed to load data. '+t.message+'</div></td></tr>'})}
        function parseDate(e){if(!e)return null;var t=e.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(t)return new Date(t[3],t[2]-1,t[1]);var o=new Date(e);return isNaN(o.getTime())?null:o}
        function sortGames(e,t){var o=e.slice();switch(t){case'az':return o.sort(function(e,t){return e.game.localeCompare(t.game)});case'za':return o.sort(function(e,t){return t.game.localeCompare(e.game)});case'recent-started':return o.sort(function(e,t){var o=parseDate(e.dateStarted),n=parseDate(t.dateStarted);return!o&&!n?0:!o?1:!n?-1:n-o});case'oldest-started':return o.sort(function(e,t){var o=parseDate(e.dateStarted),n=parseDate(t.dateStarted);return!o&&!n?0:!o?-1:!n?1:o-n});case'recent-finished':return o.sort(function(e,t){var o=parseDate(e.dateFinished),n=parseDate(t.dateFinished);return!o&&!n?0:!o?1:!n?-1:n-o});case'oldest-finished':return o.sort(function(e,t){var o=parseDate(e.dateFinished),n=parseDate(t.dateFinished);return!o&&!n?0:!o?-1:!n?1:o-n});case'rating-high':return o.sort(function(e,t){return(t.rating||0)-(e.rating||0)});case'rating-low':return o.sort(function(e,t){return(e.rating||0)-(t.rating||0)});default:return o}}
        function filterGames(e,t,o){var n=e;return'all'!==t&&(n=n.filter(function(e){return e.isFinished===t})),o.trim()&&(o=o.toLowerCase().trim(),n=n.filter(function(e){return e.game.toLowerCase().indexOf(o)>-1})),n}
        function hasValue(e){return null!==e&&void 0!==e&&e.toString().trim().length>0}
        function getPartCount(e,t){if(hasValue(e)){var o=e.toString().trim(),n=parseInt(o,10);if(!isNaN(n))return n;var a=o.match(/(\d+)\s*part/);if(a)return parseInt(a[1],10)}return t||0}
        function formatParts(e,t){if(hasValue(e)){var o=e.toString().trim();if(o.toLowerCase().indexOf('so far')>-1){o=o.replace(/so far/i,'').trim();return o.toLowerCase().indexOf('part')===-1&&(o+=o?' parts so far':'parts so far'),o}return o.toLowerCase().indexOf('part')===-1&&(o+=' part'+(t&&1!==t?'s':'')),o}return''}
        function updateAllArrows(){columnIds.forEach(function(e){var t=document.getElementById('th'+e.charAt(0).toUpperCase()+e.slice(1));if(t){var o=t.querySelector('.arrow');if(o){t.classList.remove('sorted'),o.textContent='';var n=sortDirections[e];n===currentSort&&(t.classList.add('sorted'),n.indexOf('low')>-1||'za'===n||n.indexOf('oldest')>-1?o.textContent='▲':o.textContent='▼')}}})}
        function setSort(e){var t=sortDirections[e],o=sortToggles[t];sortDirections[e]=o,currentSort=o,updateAllArrows(),renderGames()}
        function renderGames(){var e=document.getElementById('gamesBody'),t=document.getElementById('statusFilter').value,o=document.getElementById('searchInput').value,n=sortGames(allGames,currentSort),a=filterGames(n,t,o);if(updateResultCount(a.length),!a.length){e.innerHTML='<tr><td colspan="5"><div class="no-results">No games match.</div></td></tr>';return}e.innerHTML=a.map(function(e){var t=formatParts(e.partsDisplay,e.parts),o=getPartCount(e.partsDisplay,e.parts),n=e.rating&&e.rating>0?e.rating+'/10':'<span class="text-coming">COMING SOON</span>',a=hasValue(e.dateStarted)?e.dateStarted:'<span class="text-coming">COMING SOON</span>',i=hasValue(e.dateFinished)?e.dateFinished:'<span class="text-coming">COMING SOON</span>',s=hasValue(e.linkUrl),l=e.linkText||'Watch',r=s?'<a href="'+escapeHtml(e.linkUrl)+'" target="_blank" rel="noopener" class="game-link">▶ '+escapeHtml(l)+'</a>':'<span class="text-coming">COMING SOON</span>',d=t&&o>1?'<span class="game-parts-sub">'+t+'</span>':'';return'<tr><td><span class="game-name">'+escapeHtml(e.game)+'</span></td><td><span class="game-rating">'+n+'</span></td><td><span class="game-date">'+a+'</span></td><td><span class="game-date">'+i+'</span></td><td>'+r+d+'</td></tr>'}).join('')}
        function escapeHtml(e){var t=document.createElement('div');return t.textContent=e,t.innerHTML}
        function updateResultCount(e){var t=document.getElementById('resultCount');allGames.length&&(void 0!==e?t.textContent=e+' of '+allGames.length+' games':t.textContent=allGames.length+' games')}
        document.getElementById('thGame').addEventListener('click',function(){setSort('game')}),document.getElementById('thRating').addEventListener('click',function(){setSort('rating')}),document.getElementById('thStarted').addEventListener('click',function(){setSort('started')}),document.getElementById('thFinished').addEventListener('click',function(){setSort('finished')}),document.getElementById('statusFilter').addEventListener('change',renderGames);
        var searchTimeout;document.getElementById('searchInput').addEventListener('input',function(){clearTimeout(searchTimeout),searchTimeout=setTimeout(renderGames,200)});
        var themeToggle=document.getElementById('themeToggle');themeToggle.addEventListener('click',function(){document.body.classList.toggle('light-mode'),localStorage.setItem('theme',document.body.classList.contains('light-mode')?'light':'dark')}),loadGamesData();
    </script>
