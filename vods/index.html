<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png">

    <meta property="og:description" content="Complete list of game playthroughs, VODs, and ratings">

    <style>
        :root{--bg:#0b0e11;--surface:#14181d;--surface-alt:#181c22;--border:#252a30;--text:#c8cdd2;--muted:#6b7280;--accent:#e85d75;--accent-soft:rgba(232,93,117,0.15);--amber:#d2991d;--green:#4ade80;--blue:#1d5cc2;--teal:#2dd4bf;--badge-bg:rgba(48,54,61,0.8);--radius:8px;--font:system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'SF Mono','Cascadia Code','Fira Code',monospace}
        body.light-mode{--bg:#f3f4f6;--surface:#ffffff;--surface-alt:#f9fafb;--border:#d1d5db;--text:#1f2937;--muted:#6b7280;--accent:#b91c1c;--accent-soft:rgba(185,28,28,0.1);--amber:#92400e;--green:#15803d;--blue:#1d5cc2;--teal:#0d9488;--badge-bg:rgba(209,213,219,0.6)}
        *{box-sizing:border-box}
        body{background:var(--bg);color:var(--text);font-family:var(--font);margin:0;padding:0;min-height:100vh;transition:background 0.3s,color 0.3s;line-height:1.5;font-size:15px}
        html{overflow-y:scroll;scrollbar-gutter:stable}
        .nav-bar{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
        .nav-left{display:flex;align-items:center;gap:8px}
        .nav-logo{font-weight:700;font-size:1.1em;color:var(--accent);text-decoration:none;letter-spacing:-0.5px}
        .nav-links{display:flex;gap:4px;flex-wrap:wrap}
        .nav-link{background:transparent;border:1px solid transparent;border-radius:6px;padding:6px 14px;text-decoration:none;color:var(--muted);font-size:0.8em;font-weight:500;transition:all 0.15s}
        .nav-link:hover{border-color:var(--border);color:var(--text)}
        .nav-link.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
        .nav-right{display:flex;align-items:center;gap:10px}
        .theme-toggle{background:none;border:1px solid var(--border);border-radius:4px;color:var(--muted);font-family:var(--font);font-size:0.7em;padding:4px 8px;cursor:pointer;transition:all 0.15s}
        .theme-toggle:hover{border-color:var(--accent);color:var(--text)}
        .container{width:95%;margin:0 auto;padding:20px 0 40px}
        .header{text-align:center;margin-bottom:20px}
        .header h1{font-size:2em;margin:0 0 4px 0;font-weight:700;letter-spacing:-0.5px}
        .header .subtitle{color:var(--muted);font-size:0.95em;margin:0}
        .stats-bar{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px}
        .stat-item{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:10px 16px;text-align:center;min-width:90px;cursor:pointer;transition:border-color 0.2s}
        .stat-item:hover{border-color:var(--accent)}
        .stat-item.active{border-color:var(--accent);background:var(--accent-soft)}
        .stat-value{font-size:1.2em;font-weight:700;font-family:var(--mono);color:var(--accent)}
        .stat-value.green{color:var(--green)}
        .stat-value.amber{color:var(--amber)}
        .stat-value.blue{color:var(--blue)}
        .stat-label{font-size:0.65em;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);margin-top:2px}
        .filters-section{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px;align-items:center;justify-content:center}
        .filter-group{display:flex;align-items:center;gap:6px}
        .filter-group label{color:var(--muted);font-size:0.8em;text-transform:uppercase;letter-spacing:0.5px;font-weight:600;white-space:nowrap}
        .filter-group select,.filter-group input{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-family:var(--font);font-size:0.88em;outline:none;transition:border 0.2s;min-width:120px;cursor:pointer}
        .filter-group select:hover,.filter-group input:hover{border-color:var(--accent)}
        .filter-group select:focus,.filter-group input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
        .filter-group select option,.filter-group optgroup{background:var(--surface);color:var(--text)}
        .filter-group optgroup{font-weight:700;color:var(--muted);font-style:normal}
        .search-input{min-width:200px!important;flex:1;max-width:280px}
        .sort-group{display:flex;align-items:center;gap:6px}
        .sort-group label{color:var(--muted);font-size:0.8em;text-transform:uppercase;letter-spacing:0.5px;font-weight:600;white-space:nowrap}
        .sort-group select{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-family:var(--font);font-size:0.88em;outline:none;transition:border 0.2s;cursor:pointer;min-width:160px}
        .sort-group select:hover{border-color:var(--accent)}
        .sort-group select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
        .sort-group select option,.sort-group optgroup{background:var(--surface);color:var(--text)}
        .sort-group optgroup{font-weight:700;color:var(--muted);font-style:normal}
        .view-toggle{display:flex;align-items:center;gap:4px}
        .view-btn{background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:6px 12px;cursor:pointer;font-family:var(--font);font-size:0.78em;font-weight:500;border-radius:4px;transition:all 0.15s;text-transform:uppercase;letter-spacing:0.5px}
        .view-btn:hover{border-color:var(--accent);color:var(--text)}
        .view-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
        .result-count{color:var(--muted);font-size:0.82em;margin-bottom:16px;font-family:var(--mono);text-align:center}
        .year-divider{grid-column:1/-1;text-align:center;color:var(--muted);font-family:var(--mono);font-size:0.75em;padding:8px 0 4px 0;margin-top:8px;border-top:1px solid var(--border);letter-spacing:1px;text-transform:uppercase}
        .year-divider:first-child{margin-top:0;border-top:none}
        .games-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
        .games-grid.compact{grid-template-columns:repeat(7,1fr);gap:10px}
        .games-grid.compact .card-body{padding:5px 6px}
        .games-grid.compact .card-title{font-size:0.68em}
        .games-grid.compact .sb-parts,.games-grid.compact .sb-status,.games-grid.compact .sb-rating{font-size:0.58em}
        .games-grid.compact .card-status-bar{height:10%;padding:0 4px}
        .games-grid.compact .recent-badge{font-size:0.46em;padding:2px 4px;top:4px;left:4px}
        .games-grid.compact .total-duration{font-size:0.58em;padding:2px 5px;top:5px;right:5px}
        .game-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:border-color 0.2s,transform 0.2s;cursor:pointer}
        .game-card:hover{border-color:var(--accent);transform:translateY(-2px)}
        .game-card.skeleton{cursor:default;pointer-events:none}
        .game-card.skeleton:hover{border-color:var(--border);transform:none}
        .card-poster{width:100%;aspect-ratio:2/3;background:var(--surface-alt);overflow:hidden;position:relative}
        .card-poster img{width:100%;height:100%;object-fit:cover;display:block}
        .card-poster .poster-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:3em;font-weight:700;color:var(--border);background:var(--surface-alt)}
        .card-poster .skeleton-shimmer{width:100%;height:100%;background:linear-gradient(90deg,var(--surface-alt) 25%,var(--border) 50%,var(--surface-alt) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
        @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
        .card-status-bar{position:absolute;bottom:0;left:0;right:0;height:8%;display:flex;align-items:center;justify-content:space-between;padding:0 8px;pointer-events:none;background:rgba(0,0,0,0.7)}
        .card-status-bar .sb-left{text-align:left;flex:1}
        .card-status-bar .sb-center{text-align:center;flex:1}
        .card-status-bar .sb-right{text-align:right;flex:1}
        .sb-parts{font-size:0.78em;font-weight:700;font-family:var(--mono);color:#fff;white-space:nowrap}
        .sb-status{font-size:0.78em;font-weight:700;font-family:var(--mono);text-transform:uppercase;letter-spacing:0.3px;white-space:nowrap}
        .sb-status.finished{color:var(--green)}
        .sb-status.unfinished{color:var(--amber)}
        .sb-status.backlog{color:var(--blue)}
        .sb-rating{font-size:0.78em;font-weight:700;font-family:var(--mono);color:#fff;white-space:nowrap}
        .recent-badge{position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.7);color:#fff;padding:5px 12px;border-radius:4px;font-size:0.9em;font-weight:700;font-family:var(--mono);text-transform:uppercase;letter-spacing:0.5px;pointer-events:none;overflow:hidden}
        .recent-badge.new-video{background:rgba(45,212,191,0.8);color:#000}
        .recent-badge::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(-45deg,transparent 40%,rgba(255,255,255,0.04) 45%,rgba(255,255,255,0.12) 50%,rgba(255,255,255,0.04) 55%,transparent 60%);background-size:300% 300%;animation:recentShimmer 3s infinite linear}
        .recent-badge.new-video::before{background:linear-gradient(-45deg,transparent 40%,rgba(255,255,255,0.08) 45%,rgba(255,255,255,0.2) 50%,rgba(255,255,255,0.08) 55%,transparent 60%);background-size:300% 300%}
        @keyframes recentShimmer{0%{background-position:100% 100%}100%{background-position:0% 0%}}
        .total-duration{position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.65);color:#fff;padding:4px 8px;border-radius:3px;font-size:0.75em;font-weight:700;font-family:var(--mono);pointer-events:none}
        .part-duration{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,0.8);color:#fff;padding:2px 6px;border-radius:3px;font-size:0.65em;font-weight:700;font-family:var(--mono)}
        .part-new-badge{position:absolute;top:6px;left:6px;background:rgba(45,212,191,0.85);color:#000;padding:2px 7px;border-radius:3px;font-size:0.6em;font-weight:700;font-family:var(--mono);text-transform:uppercase;letter-spacing:0.5px}
        .card-body{padding:10px 12px}
        .card-title{font-weight:700;font-size:0.85em;line-height:1.2;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .card-body .skeleton-line{height:12px;background:var(--border);border-radius:4px;width:70%;margin:0 auto;animation:pulse 1.5s infinite}
        @keyframes pulse{0%,100%{opacity:0.4}50%{opacity:0.8}}
        .no-results{text-align:center;color:var(--muted);padding:48px 16px;font-size:0.95em;grid-column:1/-1}
        .footer{text-align:center;color:var(--muted);font-size:0.78em;padding-top:20px;border-top:1px solid var(--border);margin-top:40px}
        .footer a{color:var(--muted);text-decoration:none}
        .footer a:hover{color:var(--accent)}
        .popup-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:999;justify-content:center;align-items:center;padding:20px}
        .popup-overlay.active{display:flex}
        .popup-inner{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;max-width:1100px;width:95%;max-height:90vh;display:flex;flex-direction:column;position:relative}
        .popup-scroll{overflow-y:auto;flex:1;padding-right:8px}
        .popup-scroll::-webkit-scrollbar{width:5px}
        .popup-scroll::-webkit-scrollbar-track{background:transparent}
        .popup-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
        .popup-inner h2{margin:0 0 4px 0;font-size:1.4em}
        .popup-close-top{position:absolute;top:12px;right:16px;background:none;border:none;color:var(--muted);font-size:1.4em;cursor:pointer;padding:4px 8px;line-height:1;z-index:10;transition:color 0.15s}
        .popup-close-top:hover{color:var(--accent)}
        .popup-meta{color:var(--muted);font-size:1.05em;margin-bottom:18px}
        .popup-meta span{margin-right:20px;font-weight:700;color:var(--text)}
        .popup-parts-count{font-size:0.95em;color:var(--muted);margin-bottom:14px}
        .parts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;justify-content:center}
        .parts-grid.single{grid-template-columns:minmax(280px,400px);justify-content:center}
        .parts-grid.double{grid-template-columns:repeat(2,minmax(240px,400px));justify-content:center}
        .part-card{background:var(--surface-alt);border:1px solid var(--border);border-radius:6px;overflow:hidden;text-decoration:none;color:var(--text);transition:border-color 0.2s;display:block;position:relative}
        .part-card:hover{border-color:var(--accent)}
        .part-thumb{width:100%;aspect-ratio:16/9;background:var(--border);overflow:hidden;position:relative}
        .part-thumb img{width:100%;height:100%;object-fit:cover;display:block}
        .part-info{padding:10px 12px}
        .part-title{font-size:0.82em;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .popup-close-bottom{background:var(--border);border:none;color:var(--text);padding:10px 16px;border-radius:4px;cursor:pointer;font-family:var(--font);font-size:0.88em;width:100%;margin-top:12px;flex-shrink:0}
        .popup-close-bottom:hover{background:var(--accent)}
        @media(min-width:1800px){.games-grid{grid-template-columns:repeat(7,1fr)}.games-grid.compact{grid-template-columns:repeat(10,1fr)}}
        @media(max-width:1100px){.games-grid{grid-template-columns:repeat(4,1fr);gap:12px}.games-grid.compact{grid-template-columns:repeat(5,1fr);gap:8px}}
        @media(max-width:860px){.games-grid{grid-template-columns:repeat(3,1fr);gap:8px}.games-grid.compact{grid-template-columns:repeat(4,1fr);gap:6px}.container{padding:16px 0 32px}.card-body{padding:6px 8px}.card-title{font-size:0.72em}.sb-parts,.sb-status,.sb-rating{font-size:0.55em}.card-status-bar{height:10%;padding:0 3px}.parts-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}.parts-grid.single{grid-template-columns:minmax(180px,1fr)}.parts-grid.double{grid-template-columns:repeat(2,1fr)}.recent-badge{font-size:0.6em;padding:2px 6px;top:5px;left:5px}.total-duration{font-size:0.6em;padding:2px 5px;top:5px;right:5px}}
        @media(max-width:600px){.container{width:100%;padding:12px 4px 24px}.games-grid{grid-template-columns:repeat(2,1fr);gap:6px}.games-grid.compact{grid-template-columns:repeat(3,1fr);gap:4px}.filters-section{flex-direction:column;align-items:stretch}.filter-group select,.filter-group input{width:100%;max-width:none}.search-input{max-width:none!important}.sort-group select{width:100%}.nav-bar{padding:8px 12px}.nav-logo{font-size:1em}.nav-link{padding:5px 10px;font-size:0.72em}.card-body{padding:4px 5px}.card-title{font-size:0.62em}.sb-parts,.sb-status,.sb-rating{font-size:0.48em;letter-spacing:0}.card-status-bar{height:11%;padding:0 2px}.parts-grid{grid-template-columns:1fr}.parts-grid.single{grid-template-columns:1fr}.parts-grid.double{grid-template-columns:1fr}.popup-inner{padding:16px}.recent-badge{font-size:0.5em;padding:1px 4px;top:3px;left:3px}.total-duration{font-size:0.52em;padding:2px 4px;top:4px;right:4px}}
    </style>
</head>
<body data-view-transition="vods">
    <nav class="nav-bar">
        <div class="nav-left"><a href="/" class="nav-logo">GRIM_CYANIDE</a></div>
        <div class="nav-links"><a href="/" class="nav-link">Home</a><a href="/vods" class="nav-link active">VODs &amp; Ratings</a><a href="/steam" class="nav-link">Steam Games</a></div>
        <div class="nav-right"><button class="theme-toggle" id="themeToggle">light/dark</button></div>
    </nav>
    <div class="container">
        <div class="header"><h1>VODs &amp; Playthroughs</h1><p class="subtitle">My streaming archive. Every game I've recorded is here with start and finish dates, ratings out of 10, and full VODs.<br>Click any game for more info and to watch.</p></div>
        <div class="stats-bar" id="statsBar"></div>
        <div class="filters-section">
            <div class="filter-group"><label for="statusFilter">Status</label><select id="statusFilter"><option value="all">All</option><option value="Finished">Finished</option><option value="Unfinished">Unfinished</option><option value="Backlog">Backlog</option></select></div>
            <div class="filter-group"><label for="searchInput">Search</label><input type="text" id="searchInput" class="search-input" placeholder="Filter games..."></div>
            <div class="sort-group"><label for="sortSelect">Sort</label><select id="sortSelect"><optgroup label="Name"><option value="az">Name A-Z</option><option value="za">Name Z-A</option></optgroup><optgroup label="Date Started"><option value="recent-started">Recently Started</option><option value="oldest-started">Oldest Started</option></optgroup><optgroup label="Date Finished"><option value="recent-finished">Recently Finished</option><option value="oldest-finished">Oldest Finished</option></optgroup><optgroup label="Rating"><option value="rating-high">Rating High-Low</option><option value="rating-low">Rating Low-High</option></optgroup><optgroup label="Duration"><option value="duration-long">Longest</option><option value="duration-short">Shortest</option></optgroup></select></div>
            <div class="view-toggle"><button class="view-btn active" id="viewDefault" onclick="setView(5)">Default</button><button class="view-btn" id="viewCompact" onclick="setView(7)">Compact</button></div>
        </div>
        <div class="result-count" id="resultCount"></div>
        <div class="games-grid" id="gamesGrid"></div>
        <div class="footer">© 2026 <a href="https://grimcyanide.com">grimcyanide.com</a></div>
    </div>
    <div class="popup-overlay" id="popupOverlay">
        <div class="popup-inner" id="popupInner"></div>
    </div>
    <script>
        var allGames=[],currentSort='az',apiURL='https://grimcyanide-github-io.vercel.app/api/vods-sheet',posterBase='https://data.grimcyanide.com/posters/',currentView=5,gameVideoCache={},gameDurationCache={};
        var params=new URLSearchParams(window.location.search);
        if(params.get('status')){var savedStatus=params.get('status')}
        if(params.get('sort')){currentSort=params.get('sort')}
        if(params.get('search')){var savedSearch=params.get('search')}
        if(params.get('view')){currentView=parseInt(params.get('view'))}
        var openGameName=params.get('game')?decodeURIComponent(params.get('game')):null;
        var savedView=localStorage.getItem('vodsView');
        if(!params.get('view')&&savedView){currentView=parseInt(savedView)}
        function updateURL(){var e=new URLSearchParams();var t=document.getElementById('statusFilter').value;if(t!=='all')e.set('status',t);var o=document.getElementById('searchInput').value.trim();if(o)e.set('search',o);if(currentSort!=='az')e.set('sort',currentSort);if(currentView===7)e.set('view','7');if(openGameName)e.set('game',openGameName);var n=window.location.pathname+(e.toString()?'?'+e.toString():'');history.replaceState(null,'',n)}
        function renderSkeletons(){var e=document.getElementById('gamesGrid');var t='';for(var o=0;o<20;o++){t+='<div class="game-card skeleton"><div class="card-poster"><div class="skeleton-shimmer"></div></div><div class="card-body"><div class="skeleton-line"></div></div></div>'}e.innerHTML=t}
        renderSkeletons();
        function setView(e){currentView=e;localStorage.setItem('vodsView',e);document.getElementById('gamesGrid').classList.toggle('compact',e===7);document.getElementById('viewDefault').classList.toggle('active',e===5);document.getElementById('viewCompact').classList.toggle('active',e===7);renderGames();updateURL()}
        if(currentView===7){document.getElementById('gamesGrid').classList.add('compact');document.getElementById('viewDefault').classList.remove('active');document.getElementById('viewCompact').classList.add('active')}
