<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VODs & Playthroughs - GRIM_CYANIDE</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="description" content="GRIM_CYANIDE - Complete list of game playthroughs, VODs, and ratings">
    <meta name="keywords" content="grimcyanide, vods, playthroughs, game ratings, gaming, youtube playlists">
    <meta property="og:title" content="VODs & Playthroughs - GRIM_CYANIDE">
    <meta property="og:description" content="Complete list of game playthroughs, VODs, and ratings">
    <meta property="og:image" content="https://grimcyanide.com/android-chrome-512x512.png">
    <meta property="og:url" content="https://grimcyanide.com/vods">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="VODs & Playthroughs - GRIM_CYANIDE">
    <meta name="twitter:description" content="Complete list of game playthroughs, VODs, and ratings">
    <meta name="twitter:image" content="https://grimcyanide.com/android-chrome-512x512.png">
    <style>
        :root {
            --bg: #0b0e11;
            --surface: #14181d;
            --surface-alt: #181c22;
            --border: #252a30;
            --text: #c8cdd2;
            --muted: #6b7280;
            --accent: #e85d75;
            --accent-soft: rgba(232, 93, 117, 0.15);
            --amber: #d2991d;
            --badge-bg: rgba(48, 54, 61, 0.8);
            --radius: 6px;
            --font: system-ui, -apple-system, 'Segoe UI', sans-serif;
            --mono: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
        }
        body.light-mode {
            --bg: #f3f4f6;
            --surface: #ffffff;
            --surface-alt: #f9fafb;
            --border: #d1d5db;
            --text: #1f2937;
            --muted: #9ca3af;
            --accent: #dc3545;
            --accent-soft: rgba(220, 53, 69, 0.1);
            --badge-bg: rgba(208, 215, 222, 0.6);
        }
        * {
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
            line-height: 1.5;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 32px 24px;
        }
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .back-link {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.95em;
            font-family: var(--mono);
            transition: color 0.2s;
        }
        .back-link:hover {
            color: var(--accent);
        }
        .theme-toggle {
            background: none;
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--muted);
            font-family: var(--font);
            font-size: 0.8em;
            padding: 6px 12px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .theme-toggle:hover {
            border-color: var(--accent);
            color: var(--text);
        }
        .header {
            margin-bottom: 28px;
        }
        .header h1 {
            font-size: 2.2em;
            margin: 0 0 6px 0;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .header .subtitle {
            color: var(--muted);
            font-size: 1em;
            margin: 0;
        }
        .filters-section {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
            align-items: center;
        }
        .filter-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .filter-group label {
            color: var(--muted);
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            white-space: nowrap;
        }
        .filter-group select,
        .filter-group input {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 9px 14px;
            font-family: var(--font);
            font-size: 0.92em;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
            min-width: 130px;
            cursor: pointer;
        }
        .filter-group select:hover,
        .filter-group input:hover {
            border-color: var(--accent);
        }
        .filter-group select:focus,
        .filter-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }
        .filter-group select option {
            background: var(--surface);
            color: var(--text);
        }
        .search-input {
            min-width: 200px !important;
            flex: 1;
            max-width: 280px;
        }
        .result-count {
            color: var(--muted);
            font-size: 0.88em;
            margin-bottom: 12px;
            font-family: var(--mono);
        }
        .table-wrapper {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--border);
        }
        .table-scroll {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }
        thead th {
            background: var(--surface);
            color: var(--muted);
            font-size: 0.82em;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            font-weight: 600;
            padding: 12px 16px;
            text-align: center;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
            border-bottom: 1px solid var(--border);
            transition: color 0.15s;
            position: sticky;
            top: 0;
            z-index: 2;
        }
        thead th:hover {
            color: var(--accent);
        }
        thead th .arrow {
            margin-left: 4px;
            font-size: 0.7em;
            opacity: 0.5;
        }
        thead th.sorted {
            color: var(--accent);
        }
        thead th.sorted .arrow {
            opacity: 1;
            color: var(--accent);
        }
        tbody td {
            padding: 14px 16px;
            font-size: 0.95em;
            font-weight: 500;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
            word-break: break-word;
            text-align: center;
            white-space: nowrap;
        }
        tbody td.col-game {
            white-space: normal;
            min-width: 180px;
        }
        tbody td.col-rating {
            min-width: 90px;
        }
        tbody td.col-started {
            min-width: 100px;
        }
        tbody td.col-finished {
            min-width: 100px;
        }
        tbody td.col-parts {
            min-width: 100px;
        }
        tbody td.col-link {
            min-width: 140px;
        }
        tbody tr td {
            background: var(--surface);
        }
        tbody tr:nth-child(even) td {
            background: var(--surface-alt);
        }
        tbody tr:hover td {
            background: var(--badge-bg);
        }
        tbody tr:last-child td {
            border-bottom: none;
        }
        .game-name {
            font-weight: 600;
            display: block;
        }
        .game-rating {
            font-family: var(--mono);
        }
        .game-date {
            font-family: var(--mono);
            color: var(--muted);
            font-size: 0.9em;
        }
        .game-parts {
            font-family: var(--mono);
            color: var(--muted);
            font-size: 0.9em;
        }
        .game-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9em;
            transition: opacity 0.2s;
        }
        .game-link:hover {
            opacity: 0.7;
            text-decoration: underline;
        }
        .text-coming {
            color: var(--amber);
            font-style: italic;
            font-size: 0.8em;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .no-results {
            text-align: center;
            color: var(--muted);
            padding: 48px 20px;
            font-size: 1em;
        }
        .loading-container {
            text-align: center;
            padding: 48px 20px;
        }
        .loading-spinner {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-text {
            color: var(--muted);
            margin-top: 12px;
            font-size: 0.95em;
        }
        .error-container {
            text-align: center;
            padding: 32px 20px;
            color: #f85149;
            font-size: 0.95em;
        }
        .footer {
            margin-top: 40px;
            color: var(--muted);
            font-size: 0.85em;
            text-align: center;
            font-family: var(--mono);
        }
        .footer a {
            color: var(--muted);
            text-decoration: none;
        }
        .footer a:hover {
            color: var(--accent);
        }
        @media (max-width: 860px) {
            table {
                min-width: 600px;
            }
            thead th {
                font-size: 0.7em;
                padding: 10px 8px;
            }
            tbody td {
                font-size: 0.82em;
                padding: 12px 8px;
            }
            tbody td.col-game {
                min-width: 130px;
            }
            tbody td.col-rating { min-width: 65px; }
            tbody td.col-started { min-width: 75px; }
            tbody td.col-finished { min-width: 75px; }
            tbody td.col-parts { min-width: 75px; }
            tbody td.col-link { min-width: 110px; }
        }
        @media (max-width: 600px) {
            .filters-section {
                flex-direction: column;
                align-items: stretch;
            }
            .filter-group select,
            .filter-group input {
                width: 100%;
                max-width: none;
            }
            .search-input {
                max-width: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <a href="https://grimcyanide.com" class="back-link">← grimcyanide.com</a>
            <button class="theme-toggle" id="themeToggle">light/dark</button>
        </div>
        <div class="header">
            <h1>VODs &amp; Playthroughs</h1>
            <p class="subtitle">Every game played, rated and catalogued.</p>
        </div>
        <div class="filters-section">
            <div class="filter-group">
                <label for="statusFilter">Status</label>
                <select id="statusFilter">
                    <option value="all">All</option>
                    <option value="Finished">Finished</option>
                    <option value="Unfinished">Unfinished</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="searchInput">Search</label>
                <input type="text" id="searchInput" class="search-input" placeholder="Filter games...">
            </div>
        </div>
        <div class="result-count" id="resultCount"></div>
        <div class="table-wrapper">
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th class="col-game" data-col="game" id="thGame">Game <span class="arrow"></span></th>
                            <th class="col-rating" data-col="rating" id="thRating">Rating <span class="arrow"></span></th>
                            <th class="col-started sorted" data-col="started" id="thStarted">Started <span class="arrow">▼</span></th>
                            <th class="col-finished" data-col="finished" id="thFinished">Finished <span class="arrow"></span></th>
                            <th class="col-parts" data-col="parts" id="thParts">Parts <span class="arrow"></span></th>
                            <th class="col-link" id="thLink">Link</th>
                        </tr>
                    </thead>
                    <tbody id="gamesBody">
                        <tr>
                            <td colspan="6">
                                <div class="loading-container">
                                    <div class="loading-spinner"></div>
                                    <p class="loading-text">Loading...</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="footer">
            © 2026 <a href="https://grimcyanide.com">grimcyanide.com</a>
        </div>
    </div>
    <script>
        var allGames = [];
        var currentSort = 'recent-started';
        var sortDirections = { game: 'az', rating: 'rating-high', started: 'recent-started', finished: 'recent-finished', parts: 'parts-high' };
        var sortToggles = {
            'az': 'za', 'za': 'az',
            'rating-high': 'rating-low', 'rating-low': 'rating-high',
            'recent-started': 'oldest-started', 'oldest-started': 'recent-started',
            'recent-finished': 'oldest-finished', 'oldest-finished': 'recent-finished',
            'parts-high': 'parts-low', 'parts-low': 'parts-high'
        };
        var columnIds = ['game', 'rating', 'started', 'finished', 'parts'];
        var apiURL = 'https://grimcyanide-github-io.vercel.app/api/vods-sheet';
        function loadGamesData() {
            var body = document.getElementById('gamesBody');
            var url = apiURL + '?t=' + Date.now();
            fetch(url)
                .then(function(r) { if (!r.ok) throw new Error('API returned ' + r.status); return r.json(); })
                .then(function(data) {
                    if (data.error) throw new Error(data.error);
                    if (!data.games || !data.games.length) {
                        body.innerHTML = '<tr><td colspan="6"><div class="no-results">No games found.</div></td></tr>';
                        return;
                    }
                    allGames = data.games;
                    currentSort = 'recent-started';
                    sortDirections = { game: 'az', rating: 'rating-high', started: 'recent-started', finished: 'recent-finished', parts: 'parts-high' };
                    updateAllArrows();
                    renderGames();
                    updateResultCount();
                })
                .catch(function(error) {
                    console.error('Error:', error);
                    body.innerHTML = '<tr><td colspan="6"><div class="error-container">Failed to load data. ' + error.message + '</div></td></tr>';
                });
        }
        function parseDate(dateStr) {
            if (!dateStr) return null;
            var dmyMatch = dateStr.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
            if (dmyMatch) return new Date(dmyMatch[3], dmyMatch[2] - 1, dmyMatch[1]);
            var parsed = new Date(dateStr);
            if (!isNaN(parsed.getTime())) return parsed;
            return null;
        }
        function sortGames(games, sortBy) {
            var sorted = games.slice();
            switch (sortBy) {
                case 'az': return sorted.sort(function(a, b) { return a.game.localeCompare(b.game); });
                case 'za': return sorted.sort(function(a, b) { return b.game.localeCompare(a.game); });
                case 'recent-started': return sorted.sort(function(a, b) { var dA = parseDate(a.dateStarted), dB = parseDate(b.dateStarted); if (!dA && !dB) return 0; if (!dA) return 1; if (!dB) return -1; return dB - dA; });
                case 'oldest-started': return sorted.sort(function(a, b) { var dA = parseDate(a.dateStarted), dB = parseDate(b.dateStarted); if (!dA && !dB) return 0; if (!dA) return -1; if (!dB) return 1; return dA - dB; });
                case 'recent-finished': return sorted.sort(function(a, b) { var dA = parseDate(a.dateFinished), dB = parseDate(b.dateFinished); if (!dA && !dB) return 0; if (!dA) return 1; if (!dB) return -1; return dB - dA; });
                case 'oldest-finished': return sorted.sort(function(a, b) { var dA = parseDate(a.dateFinished), dB = parseDate(b.dateFinished); if (!dA && !dB) return 0; if (!dA) return -1; if (!dB) return 1; return dA - dB; });
                case 'rating-high': return sorted.sort(function(a, b) { return (b.rating || 0) - (a.rating || 0); });
                case 'rating-low': return sorted.sort(function(a, b) { return (a.rating || 0) - (b.rating || 0); });
                case 'parts-high': return sorted.sort(function(a, b) { return (b.parts || 0) - (a.parts || 0); });
                case 'parts-low': return sorted.sort(function(a, b) { return (a.parts || 0) - (b.parts || 0); });
                default: return sorted;
            }
        }
        function filterGames(games, statusFilter, searchQuery) {
            var filtered = games;
            if (statusFilter !== 'all') filtered = filtered.filter(function(g) { return g.isFinished === statusFilter; });
            if (searchQuery.trim()) {
                var q = searchQuery.toLowerCase().trim();
                filtered = filtered.filter(function(g) { return g.game.toLowerCase().indexOf(q) > -1; });
            }
            return filtered;
        }
        function hasValue(val) {
            return val !== null && val !== undefined && val.toString().trim().length > 0;
        }
        function formatParts(partsDisplay, parts) {
            if (hasValue(partsDisplay)) {
                var text = partsDisplay.toString().trim();
                if (text.toLowerCase().indexOf('so far') > -1) {
                    text = text.replace(/so far/i, '').trim();
                    if (text.toLowerCase().indexOf('part') === -1) text = text + (text ? ' parts so far' : 'parts so far');
                    else text = text + ' so far';
                    return text;
                }
                if (text.toLowerCase().indexOf('part') === -1) {
                    text = text + ' part' + ((parts && parts !== 1) ? 's' : '');
                }
                return text;
            }
            return '';
        }
        function updateAllArrows() {
            columnIds.forEach(function(col) {
                var th = document.getElementById('th' + col.charAt(0).toUpperCase() + col.slice(1));
                if (!th) return;
                var arrow = th.querySelector('.arrow');
                if (!arrow) return;
                th.classList.remove('sorted');
                arrow.textContent = '';
                var dir = sortDirections[col];
                if (dir === currentSort) {
                    th.classList.add('sorted');
                    if (dir.indexOf('low') > -1 || dir === 'za' || dir.indexOf('oldest') > -1) {
                        arrow.textContent = '▲';
                    } else {
                        arrow.textContent = '▼';
                    }
                }
            });
        }
        function setSort(col) {
            var current = sortDirections[col];
            var next = sortToggles[current];
            sortDirections[col] = next;
            currentSort = next;
            updateAllArrows();
            renderGames();
        }
        function renderGames() {
            var body = document.getElementById('gamesBody');
            var statusFilter = document.getElementById('statusFilter').value;
            var searchQuery = document.getElementById('searchInput').value;
            var sorted = sortGames(allGames, currentSort);
            var filtered = filterGames(sorted, statusFilter, searchQuery);
            updateResultCount(filtered.length);
            if (filtered.length === 0) {
                body.innerHTML = '<tr><td colspan="6"><div class="no-results">No games match.</div></td></tr>';
                return;
            }
            body.innerHTML = filtered.map(function(g) {
                var partsText = formatParts(g.partsDisplay, g.parts);
                var ratingText = (g.rating && g.rating > 0) ? g.rating + '/10' : '<span class="text-coming">COMING SOON</span>';
                var startedText = hasValue(g.dateStarted) ? g.dateStarted : '<span class="text-coming">COMING SOON</span>';
                var finishedText = hasValue(g.dateFinished) ? g.dateFinished : '<span class="text-coming">COMING SOON</span>';
                var partsDisplay = partsText ? partsText : '<span class="text-coming">COMING SOON</span>';
                var hasLink = hasValue(g.linkUrl);
                var linkHtml = hasLink
                    ? '<a href="' + escapeHtml(g.linkUrl) + '" target="_blank" rel="noopener" class="game-link">▶ ' + escapeHtml(g.linkText || 'Watch') + '</a>'
                    : '<span class="text-coming">COMING SOON</span>';
                return '<tr>' +
                    '<td class="col-game"><span class="game-name">' + escapeHtml(g.game) + '</span></td>' +
                    '<td class="col-rating"><span class="game-rating">' + ratingText + '</span></td>' +
                    '<td class="col-started"><span class="game-date">' + startedText + '</span></td>' +
                    '<td class="col-finished"><span class="game-date">' + finishedText + '</span></td>' +
                    '<td class="col-parts"><span class="game-parts">' + partsDisplay + '</span></td>' +
                    '<td class="col-link">' + linkHtml + '</td>' +
                '</tr>';
            }).join('');
        }
        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        function updateResultCount(filteredCount) {
            var el = document.getElementById('resultCount');
            if (!allGames.length) return;
            if (filteredCount !== undefined) el.textContent = filteredCount + ' of ' + allGames.length + ' games';
            else el.textContent = allGames.length + ' games';
        }
        document.getElementById('thGame').addEventListener('click', function() { setSort('game'); });
        document.getElementById('thRating').addEventListener('click', function() { setSort('rating'); });
        document.getElementById('thStarted').addEventListener('click', function() { setSort('started'); });
        document.getElementById('thFinished').addEventListener('click', function() { setSort('finished'); });
        document.getElementById('thParts').addEventListener('click', function() { setSort('parts'); });
        document.getElementById('statusFilter').addEventListener('change', renderGames);
        var searchTimeout;
        document.getElementById('searchInput').addEventListener('input', function() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(renderGames, 200);
        });
        var themeToggle = document.getElementById('themeToggle');
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
        }
        themeToggle.addEventListener('click', function() {
            document.body.classList.toggle('light-mode');
            localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
        });
        loadGamesData();
    </script>
</body>
</html>
