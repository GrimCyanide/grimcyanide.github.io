    <style>
        :root{--bg:#0b0e11;--surface:#14181d;--surface-alt:#181c22;--border:#252a30;--text:#c8cdd2;--muted:#6b7280;--accent:#e85d75;--accent-soft:rgba(232,93,117,0.15);--amber:#d2991d;--green:#4ade80;--badge-bg:rgba(48,54,61,0.8);--radius:8px;--font:system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'SF Mono','Cascadia Code','Fira Code',monospace}
        body.light-mode{--bg:#f3f4f6;--surface:#ffffff;--surface-alt:#f9fafb;--border:#d1d5db;--text:#1f2937;--muted:#6b7280;--accent:#b91c1c;--accent-soft:rgba(185,28,28,0.1);--amber:#92400e;--green:#15803d;--badge-bg:rgba(209,213,219,0.6)}
        *{box-sizing:border-box}
        body{background:var(--bg);color:var(--text);font-family:var(--font);margin:0;padding:0;min-height:100vh;transition:background 0.3s,color 0.3s;line-height:1.5;font-size:15px}
        html{overflow-y:scroll;scrollbar-gutter:stable}
        .nav-bar{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
        .nav-left{display:flex;align-items:center;gap:8px}
        .nav-logo{font-weight:700;font-size:1.1em;color:var(--accent);text-decoration:none;letter-spacing:-0.5px}
        .nav-links{display:flex;gap:4px;flex-wrap:wrap}
        .nav-link{background:transparent;border:1px solid transparent;border-radius:6px;padding:6px 14px;text-decoration:none;color:var(--muted);font-size:0.8em;font-weight:500;transition:all 0.15s}
        .nav-link:hover{border-color:var(--border);color:var(--text)}
        .nav-link.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
        .nav-right{display:flex;align-items:center;gap:10px}
        .theme-toggle{background:none;border:1px solid var(--border);border-radius:4px;color:var(--muted);font-family:var(--font);font-size:0.7em;padding:4px 8px;cursor:pointer;transition:all 0.15s}
        .theme-toggle:hover{border-color:var(--accent);color:var(--text)}
        .container{max-width:1400px;margin:0 auto;padding:24px 24px 40px}

        .header h1{font-size:2em;margin:0 0 4px 0;font-weight:700;letter-spacing:-0.5px}
        .header .subtitle{color:var(--muted);font-size:0.95em;margin:0}
        .stats-bar{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:20px}

        .stat-value.amber{color:var(--amber)}
        .stat-value.muted{color:var(--muted)}
        .stat-label{font-size:0.65em;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);margin-top:2px}
        .filters-section{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px;align-items:center;justify-content:center}

        .filter-group label{color:var(--muted);font-size:0.8em;text-transform:uppercase;letter-spacing:0.5px;font-weight:600;white-space:nowrap}

        .filter-group select option{background:var(--surface);color:var(--text)}
        .search-input{min-width:200px!important;flex:1;max-width:280px}
        .sort-group{display:flex;align-items:center;gap:6px}
        .sort-group label{color:var(--muted);font-size:0.8em;text-transform:uppercase;letter-spacing:0.5px;font-weight:600;white-space:nowrap}
        .sort-group select{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-family:var(--font);font-size:0.88em;outline:none;transition:border 0.2s;cursor:pointer;min-width:140px}
        .sort-group select:hover{border-color:var(--accent)}

        .year-divider{grid-column:1/-1;text-align:center;color:var(--muted);font-family:var(--mono);font-size:0.75em;padding:8px 0 4px 0;margin-top:8px;border-top:1px solid var(--border);letter-spacing:1px;text-transform:uppercase}

        .games-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
        .games-grid.compact{grid-template-columns:repeat(7,1fr);gap:10px}
        .games-grid.compact .card-body{padding:6px 8px}
        .games-grid.compact .card-title{font-size:0.72em}
        .games-grid.compact .sb-parts,.games-grid.compact .sb-status,.games-grid.compact .sb-rating{font-size:0.68em}
        .games-grid.compact .card-status-bar{padding:0 6px;height:7%}
        .game-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:border-color 0.2s,transform 0.2s;cursor:pointer}
        .game-card:hover{border-color:var(--accent);transform:translateY(-2px)}
        .game-card.skeleton{cursor:default;pointer-events:none}
        .game-card.skeleton:hover{border-color:var(--border);transform:none}
        .card-poster{width:100%;aspect-ratio:2/3;background:var(--surface-alt);overflow:hidden;position:relative}
        .card-poster img{width:100%;height:100%;object-fit:cover;display:block}
        .card-poster .poster-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:3em;font-weight:700;color:var(--border);background:var(--surface-alt)}
        .card-poster .skeleton-shimmer{width:100%;height:100%;background:linear-gradient(90deg,var(--surface-alt) 25%,var(--border) 50%,var(--surface-alt) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
        @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
        .card-status-bar{position:absolute;bottom:0;left:0;right:0;height:8%;display:flex;align-items:center;justify-content:space-between;padding:0 10px;pointer-events:none;background:rgba(0,0,0,0.7)}
        .card-status-bar .sb-left{text-align:left;flex:1}
        .card-status-bar .sb-center{text-align:center;flex:1}
        .card-status-bar .sb-right{text-align:right;flex:1}
        .sb-parts{font-size:0.86em;font-weight:700;font-family:var(--mono);color:#fff}
        .sb-status{font-size:0.86em;font-weight:700;font-family:var(--mono);text-transform:uppercase;letter-spacing:0.5px}
        .sb-status.finished{color:var(--green)}
        .sb-status.unfinished{color:var(--amber)}
        .sb-status.backlog{color:var(--muted)}
        .sb-rating{font-size:0.86em;font-weight:700;font-family:var(--mono);color:#fff}
        .recent-badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,0.7);color:var(--green);padding:2px 7px;border-radius:3px;font-size:0.55em;font-weight:700;font-family:var(--mono);text-transform:uppercase;letter-spacing:0.5px;overflow:hidden;pointer-events:none}
        .recent-badge::after{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(45deg,transparent 40%,rgba(255,255,255,0.08) 45%,rgba(255,255,255,0.15) 50%,rgba(255,255,255,0.08) 55%,transparent 60%);animation:sweep 4s infinite}
        @keyframes sweep{0%{transform:translate(-100%,-100%)}100%{transform:translate(100%,100%)}}
        .card-body{padding:10px 12px}
        .card-title{font-weight:700;font-size:0.85em;line-height:1.2;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .card-body .skeleton-line{height:12px;background:var(--border);border-radius:4px;width:70%;margin:0 auto;animation:pulse 1.5s infinite}
        @keyframes pulse{0%,100%{opacity:0.4}50%{opacity:0.8}}
        .no-results{text-align:center;color:var(--muted);padding:48px 16px;font-size:0.95em;grid-column:1/-1}
        .footer{text-align:center;color:var(--muted);font-size:0.78em;padding-top:20px;border-top:1px solid var(--border);margin-top:40px}
        .footer a{color:var(--muted);text-decoration:none}
        .footer a:hover{color:var(--accent)}
        .popup-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:999;justify-content:center;align-items:flex-start;padding-top:30px}
        .popup-overlay.active{display:flex}
        .popup-inner{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;max-width:1100px;width:94%;max-height:85vh;overflow-y:auto}
        .popup-inner h2{margin:0 0 4px 0;font-size:1.4em}
        .popup-meta{color:var(--muted);font-size:0.88em;margin-bottom:18px}
        .popup-meta span{margin-right:20px}
        .popup-parts-count{font-size:0.95em;color:var(--muted);margin-bottom:14px}
        .parts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;justify-content:center}
        .parts-grid.single{grid-template-columns:minmax(280px,400px);justify-content:center}
        .parts-grid.double{grid-template-columns:repeat(2,minmax(240px,400px));justify-content:center}
        .part-card{background:var(--surface-alt);border:1px solid var(--border);border-radius:6px;overflow:hidden;text-decoration:none;color:var(--text);transition:border-color 0.2s;display:block}
        .part-card:hover{border-color:var(--accent)}
        .part-thumb{width:100%;aspect-ratio:16/9;background:var(--border);overflow:hidden}
        .part-thumb img{width:100%;height:100%;object-fit:cover;display:block}
        .part-info{padding:10px 12px}
        .part-title{font-size:0.82em;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .popup-close{background:var(--border);border:none;color:var(--text);padding:10px 16px;border-radius:4px;cursor:pointer;margin-top:18px;font-family:var(--font);font-size:0.88em;width:100%}
        .popup-close:hover{background:var(--accent)}
        .popup-inner::-webkit-scrollbar{width:5px}
        .popup-inner::-webkit-scrollbar-track{background:transparent}
        .popup-inner::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
        @media(max-width:1100px){.games-grid{grid-template-columns:repeat(4,1fr);gap:12px}.games-grid.compact{grid-template-columns:repeat(5,1fr);gap:8px}}
        @media(max-width:860px){.games-grid{grid-template-columns:repeat(3,1fr);gap:10px}.games-grid.compact{grid-template-columns:repeat(4,1fr);gap:8px}.container{padding:16px 8px 32px}.card-body{padding:8px 10px}.card-title{font-size:0.78em}.parts-grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}.parts-grid.single{grid-template-columns:minmax(200px,1fr)}.parts-grid.double{grid-template-columns:repeat(2,1fr)}.sb-parts,.sb-status,.sb-rating{font-size:0.72em}}
        @media(max-width:600px){.games-grid{grid-template-columns:repeat(2,1fr);gap:8px}.games-grid.compact{grid-template-columns:repeat(3,1fr);gap:6px}.filters-section{flex-direction:column;align-items:stretch}.filter-group select,.filter-group input{width:100%;max-width:none}.search-input{max-width:none!important}.sort-group select{width:100%}.nav-bar{padding:8px 12px}.nav-logo{font-size:1em}.nav-link{padding:5px 10px;font-size:0.72em}.parts-grid{grid-template-columns:1fr}.parts-grid.single{grid-template-columns:1fr}.parts-grid.double{grid-template-columns:1fr}.popup-inner{padding:16px}.sb-parts,.sb-status,.sb-rating{font-size:0.65em}}
    </style>
</head>
<body data-view-transition="vods">
    <nav class="nav-bar">
        <div class="nav-left"><a href="/" class="nav-logo">GRIM_CYANIDE</a></div>
        <div class="nav-links"><a href="/" class="nav-link">Home</a><a href="/vods" class="nav-link active">VODs &amp; Ratings</a><a href="/steam" class="nav-link">Steam Games</a></div>
        <div class="nav-right"><button class="theme-toggle" id="themeToggle">light/dark</button></div>
    </nav>
    <div class="container">
        <div class="header"><h1>VODs &amp; Playthroughs</h1><p class="subtitle">Every game played, rated and catalogued.</p></div>
        <div class="stats-bar" id="statsBar"></div>
        <div class="filters-section">
            <div class="filter-group"><label for="statusFilter">Status</label><select id="statusFilter"><option value="all">All</option><option value="Finished">Finished</option><option value="Unfinished">Unfinished</option><option value="Backlog">Backlog</option></select></div>
            <div class="filter-group"><label for="searchInput">Search</label><input type="text" id="searchInput" class="search-input" placeholder="Filter games..."></div>
            <div class="sort-group"><label for="sortSelect">Sort</label><select id="sortSelect"><option value="az">Name A-Z</option><option value="za">Name Z-A</option><option value="recent-started">Recently Started</option><option value="oldest-started">Oldest Started</option><option value="recent-finished">Recently Finished</option><option value="oldest-finished">Oldest Finished</option><option value="rating-high">Rating High-Low</option><option value="rating-low">Rating Low-High</option></select></div>
            <div class="view-toggle"><button class="view-btn active" id="viewDefault" onclick="setView(5)">5</button><button class="view-btn" id="viewCompact" onclick="setView(7)">7</button></div>
        </div>
        <div class="result-count" id="resultCount"></div>
        <div class="games-grid" id="gamesGrid"></div>
        <div class="footer">© 2026 <a href="https://grimcyanide.com">grimcyanide.com</a></div>
    </div>
    <div class="popup-overlay" id="popupOverlay">
        <div class="popup-inner" id="popupInner"></div>
    </div>
    <script>
        var allGames=[],currentSort='az',apiURL='https://grimcyanide-github-io.vercel.app/api/vods-sheet',posterBase='https://data.grimcyanide.com/posters/',currentView=5;
        function renderSkeletons(){var e=document.getElementById('gamesGrid');var t='';for(var o=0;o<10;o++){t+='<div class="game-card skeleton"><div class="card-poster"><div class="skeleton-shimmer"></div></div><div class="card-body"><div class="skeleton-line"></div></div></div>'}e.innerHTML=t}
        renderSkeletons();
        function setView(e){currentView=e;document.getElementById('gamesGrid').classList.toggle('compact',e===7);document.getElementById('viewDefault').classList.toggle('active',e===5);document.getElementById('viewCompact').classList.toggle('active',e===7);renderGames()}
        function loadGamesData(){var e=document.getElementById('gamesGrid'),t=apiURL+'?t='+Date.now();fetch(t).then(function(e){if(!e.ok)throw new Error('API returned '+e.status);return e.json()}).then(function(t){if(t.error)throw new Error(t.error);t.games&&t.games.length?(allGames=t.games,renderStats(),renderGames(),updateResultCount()):e.innerHTML='<div class="no-results">No games found.</div>'}).catch(function(t){e.innerHTML='<div class="no-results">Failed to load data. '+t.message+'</div>'})}
        function parseDate(e){if(!e)return null;var t=e.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(t)return new Date(t[3],t[2]-1,t[1]);var o=new Date(e);return isNaN(o.getTime())?null:o}
        function getYear(e){var t=parseDate(e);return t?t.getFullYear():null}
        function isRecent(e){if(!e)return false;var t=parseDate(e);if(!t)return false;var o=new Date();o.setDate(o.getDate()-30);return t>=o}
        function sortGames(e,t){var o=e.slice();switch(t){case'az':return o.sort(function(e,t){return e.game.localeCompare(t.game)});case'za':return o.sort(function(e,t){return t.game.localeCompare(e.game)});case'recent-started':return o.sort(function(e,t){var o=parseDate(e.dateStarted),n=parseDate(t.dateStarted);return!o&&!n?0:!o?1:!n?-1:n-o});case'oldest-started':return o.sort(function(e,t){var o=parseDate(e.dateStarted),n=parseDate(t.dateStarted);return!o&&!n?0:!o?-1:!n?1:o-n});case'recent-finished':return o.sort(function(e,t){var o=parseDate(e.dateFinished),n=parseDate(t.dateFinished);return!o&&!n?0:!o?1:!n?-1:n-o});case'oldest-finished':return o.sort(function(e,t){var o=parseDate(e.dateFinished),n=parseDate(t.dateFinished);return!o&&!n?0:!o?-1:!n?1:o-n});case'rating-high':return o.sort(function(e,t){return(t.rating||0)-(e.rating||0)});case'rating-low':return o.sort(function(e,t){return(e.rating||0)-(t.rating||0)});default:return o}}
        function getDisplayStatus(e){return e.isFinished==='Finished'?'Finished':(hasValue(e.dateStarted)?'Unfinished':'Backlog')}
        function filterGames(e,t,o){var n=e;if(t==='Finished'){n=n.filter(function(e){return e.isFinished==='Finished'})}else if(t==='Unfinished'){n=n.filter(function(e){return e.isFinished!=='Finished'&&hasValue(e.dateStarted)})}else if(t==='Backlog'){n=n.filter(function(e){return e.isFinished!=='Finished'&&!hasValue(e.dateStarted)})}o.trim()&&(o=o.toLowerCase().trim(),n=n.filter(function(e){return e.game.toLowerCase().indexOf(o)>-1}));return n}
        function hasValue(e){return null!==e&&void 0!==e&&e.toString().trim().length>0}
        function getPosterUrl(e){if(!e||e==='0'||e==='N/A')return null;return posterBase+e+'.jpg'}
        function getRatingDisplay(e,t){return e&&e>0?e+'/10':null}
        function renderStats(){var e=allGames.length,t=0,o=0,n=0;allGames.forEach(function(e){var a=getDisplayStatus(e);if(a==='Finished')t++;else if(a==='Unfinished')o++;else if(a==='Backlog')n++});var a=allGames.filter(function(e){return e.rating&&e.rating>0});var i=a.length>0?(a.reduce(function(e,t){return e+(t.rating||0)},0)/a.length).toFixed(1):'N/A';document.getElementById('statsBar').innerHTML='<div class="stat-item" data-filter="all"><div class="stat-value">'+e+'</div><div class="stat-label">Total</div></div><div class="stat-item" data-filter="Finished"><div class="stat-value green">'+t+'</div><div class="stat-label">Finished</div></div><div class="stat-item" data-filter="Unfinished"><div class="stat-value amber">'+o+'</div><div class="stat-label">Unfinished</div></div><div class="stat-item" data-filter="Backlog"><div class="stat-value muted">'+n+'</div><div class="stat-label">Backlog</div></div><div class="stat-item" data-filter=""><div class="stat-value">'+i+'</div><div class="stat-label">Avg Rating</div></div>';document.querySelectorAll('.stat-item[data-filter]').forEach(function(e){if(e.dataset.filter){e.addEventListener('click',function(){document.getElementById('statusFilter').value=this.dataset.filter;renderGames();updateStatActive()})}});updateStatActive()}
        function updateStatActive(){var e=document.getElementById('statusFilter').value;document.querySelectorAll('.stat-item[data-filter]').forEach(function(t){t.classList.toggle('active',t.dataset.filter===e)})}
        function renderGames(){var e=document.getElementById('gamesGrid'),t=document.getElementById('statusFilter').value,o=document.getElementById('searchInput').value,n=sortGames(allGames,currentSort),a=filterGames(n,t,o);updateResultCount(a.length);if(!a.length){e.innerHTML='<div class="no-results">No games match.</div>';return}var i=null;var s=currentSort.indexOf('started')>-1||currentSort.indexOf('finished')>-1;var l='';for(var r=0;r<a.length;r++){var d=a[r];var p=getYear(s?(currentSort.indexOf('started')>-1?d.dateStarted:d.dateFinished):null);if(s&&p&&p!==i){i=p;l+='<div class="year-divider">'+p+'</div>'}var u=getPosterUrl(d.poster),h=getRatingDisplay(d.rating,d.ratingDisplay),c=h||'N/A';var m=getDisplayStatus(d);var g=m==='Finished'?'finished':(m==='Unfinished'?'unfinished':'backlog');var v=m.toUpperCase();var f=d.parts||0;var y=escapeHtml(d.game),b=escapeHtml(d.game.charAt(0));var w=encodeURIComponent(JSON.stringify(d));var S='';if(m==='Finished'&&isRecent(d.dateFinished)){S='<div class="recent-badge">NEW</div>'}l+='<div class="game-card" data-game=\''+w+'\'><div class="card-poster">'+S+(u?'<img src="'+u+'" alt="'+y+'" loading="lazy">':'<div class="poster-fallback">'+b+'</div>')+'<div class="card-status-bar"><span class="sb-left sb-parts">'+f+' part'+(f!==1?'s':'')+'</span><span class="sb-center sb-status '+g+'">'+v+'</span><span class="sb-right sb-rating">'+c+'</span></div></div><div class="card-body"><div class="card-title">'+y+'</div></div></div>'}e.innerHTML=l;document.querySelectorAll('.game-card').forEach(function(e){e.addEventListener('click',function(){openPopup(this.getAttribute('data-game'))})});document.querySelectorAll('.card-poster img').forEach(function(e){e.addEventListener('error',function(){var t=this.parentNode;var o=t.querySelector('.recent-badge')?t.querySelector('.recent-badge').outerHTML:'';var n=t.querySelector('.card-status-bar')?t.querySelector('.card-status-bar').outerHTML:'';var a=t.parentNode.querySelector('.card-title').textContent.charAt(0);t.innerHTML=o+'<div class="poster-fallback">'+a+'</div>'+n})})}
        function openPopup(e){var t=JSON.parse(decodeURIComponent(e));var o=document.getElementById('popupOverlay'),n=document.getElementById('popupInner');if(!t){return}var a=getRatingDisplay(t.rating,t.ratingDisplay)?'Rating: '+getRatingDisplay(t.rating,t.ratingDisplay):'Rating: N/A';var i=hasValue(t.dateStarted)?t.dateStarted:'TBD';var s=hasValue(t.dateFinished)?t.dateFinished:'TBD';var l=hasValue(t.linkUrl)&&t.linkUrl!=='N/A';var r=t.linkText||'Watch';var d=t.parts||0;var p='<div class="loading-container"><div class="loading-spinner"></div><p class="loading-text">Loading parts...</p></div>';n.innerHTML='<h2>'+escapeHtml(t.game)+'</h2><div class="popup-meta"><span>Status: '+getDisplayStatus(t)+'</span><span>'+a+'</span><span>Started: '+i+'</span><span>Finished: '+s+'</span></div>'+(d>1?'<div class="popup-parts-count">'+d+' Parts</div>':'')+p+'<button class="popup-close" onclick="closePopup()">close</button>';o.classList.add('active');if(l){fetch('https://grimcyanide-github-io.vercel.app/api/youtube-parts?url='+encodeURIComponent(t.linkUrl)).then(function(e){return e.json()}).then(function(e){var o='';var a='parts-grid';if(e.parts&&e.parts.length>0){if(e.parts.length===1){a+=' single'}else if(e.parts.length===2){a+=' double'}o='<div class="'+a+'">';e.parts.forEach(function(e){o+='<a href="'+e.url+'" target="_blank" class="part-card"><div class="part-thumb"><img src="'+e.thumbnail+'" alt="'+escapeHtml(e.title)+'" loading="lazy"></div><div class="part-info"><div class="part-title">'+escapeHtml(e.title)+'</div></div></a>'});o+='</div>'}else{o='<a href="'+escapeHtml(t.linkUrl)+'" target="_blank" style="color:var(--accent);text-decoration:none;font-weight:600;font-size:1.1em">▶ Watch on YouTube</a>'}n.querySelector('.loading-container').outerHTML=o}).catch(function(){n.querySelector('.loading-container').outerHTML='<span style="color:var(--amber);font-style:italic">Failed to load parts</span>'})}else{n.querySelector('.loading-container').outerHTML='<span style="color:var(--amber);font-style:italic">No link available</span>'}}
        function closePopup(){document.getElementById('popupOverlay').classList.remove('active')}
