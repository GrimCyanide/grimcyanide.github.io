<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="description" content="GRIM_CYANIDE - UK gamer streaming for fun and company. Playing games like Elden Ring, Cyberpunk 2077, Assassin's Creed and more. Drop by and say hello!">
    <meta name="keywords" content="grimcyanide, GRIM_CYANIDE, streaming, uk, united kingdom, uk streamer, british, gamer, twitch, youtube, gaming, elden ring, cyberpunk 2077, assassin's creed, alan wake, call of duty, battlefield, roguelike, soulslike, dead by daylight, balatro, helldivers 2, fall guys, the last of us, pubg, rdr2, red dead redemption 2, satisfactory, wuthering waves, horror, adventure, resident evil, fromsoftware, indie games, multiplayer, single player, fps, rpg">

    <style>
        :root {
            --bg: #0b0e11;
            --surface: #14181d;
            --border: #252a30;
            --text: #c8cdd2;
            --muted: #6b7280;
            --accent: #e85d75;
            --accent-soft: rgba(232, 93, 117, 0.15);
            --green: #4ade80;
            --green-bg: rgba(74, 222, 128, 0.12);
            --radius: 6px;
            --font: system-ui, -apple-system, 'Segoe UI', sans-serif;
        }
        body.light-mode {
            --bg: #f3f4f6;
            --surface: #ffffff;
            --border: #d1d5db;
            --text: #1f2937;
            --muted: #9ca3af;
            --accent: #dc3545;
            --accent-soft: rgba(220, 53, 69, 0.1);
        }
        * {
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
            line-height: 1.4;
            font-size: 15px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 20px 40px;
        }
        .top-row {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.6em;
            margin: 0;
            font-weight: 700;
            letter-spacing: -1px;
            color: var(--text);
        }
        .social-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 32px;
        }
        .social-link {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 16px;
            text-decoration: none;
            color: var(--text);
            font-size: 0.88em;
            transition: border 0.2s, background 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .social-link:hover {
            border-color: var(--accent);
            background: var(--accent-soft);
        }
        .social-link .platform {
            font-weight: 600;
            color: var(--accent);
        }
        .social-link .username {
            color: var(--muted);
            font-size: 0.85em;
        }
        .content {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 24px;
            align-items: stretch;
        }
        @media (max-width: 900px) {
            .content {
                grid-template-columns: 1fr;
            }
        }
        .twitch-col {
            min-width: 0;
        }
        .twitch-embed {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            background: #000;
            aspect-ratio: 16 / 9;
            position: relative;
            width: 100%;
        }
        .twitch-embed iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
        }
        .vods-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .vods-panel-header {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .vods-panel-header a {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.8em;
            font-weight: 500;
            text-transform: none;
            letter-spacing: 0;
        }
        .vods-panel-header a:hover {
            text-decoration: underline;
        }
        .vods-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .vod-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 10px;
            border-radius: 4px;
            font-size: 0.84em;
            transition: background 0.15s;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            flex-shrink: 0;
        }
        .vod-row:hover {
            background: var(--accent-soft);
        }
        .vod-name {
            font-weight: 500;
            flex: 1;
            min-width: 0;
            text-align: center;
        }
        .vod-rating {
            color: var(--muted);
            font-size: 0.85em;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .vod-status {
            font-size: 0.7em;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 10px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .status-finished {
            background: var(--green-bg);
            color: var(--green);
        }
        .vods-list::-webkit-scrollbar {
            width: 5px;
        }
        .vods-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .vods-list::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        .footer {
            margin-top: 40px;
            text-align: center;
            color: var(--muted);
            font-size: 0.8em;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }
        .theme-toggle {
            background: none;
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--muted);
            font-family: var(--font);
            font-size: 0.75em;
            padding: 5px 10px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .theme-toggle:hover {
            border-color: var(--accent);
            color: var(--text);
        }
        .game-popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }
        .game-popup.active {
            display: flex;
        }
        .game-popup-inner {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            max-width: 420px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .game-popup-inner h3 {
            margin: 0 0 12px 0;
            font-size: 1.1em;
        }
        .game-popup-inner p {
            margin: 4px 0;
            font-size: 0.88em;
            color: var(--muted);
        }
        .game-popup-inner p strong {
            color: var(--text);
        }
        .game-popup-inner a {
            color: var(--accent);
        }
        .game-popup-close {
            background: var(--border);
            border: none;
            color: var(--text);
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 14px;
            font-family: var(--font);
            font-size: 0.85em;
        }
        .game-popup-close:hover {
            background: var(--accent);
        }
        @media (max-width: 600px) {
            .header h1 {
                font-size: 2em;
            }
            .social-link {
                padding: 8px 12px;
                font-size: 0.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-row">
            <button class="theme-toggle" id="themeToggle">light/dark</button>
        </div>
        <div class="header">
            <h1>GRIM_CYANIDE</h1>
        </div>
        <div class="social-links">
            <a href="https://www.twitch.tv/grim_cyanide" class="social-link" target="_blank"><span class="platform">Twitch</span><span class="username">GRIM_CYANIDE</span></a>
            <a href="https://x.com/GrimCyanide" class="social-link" target="_blank"><span class="platform">X</span><span class="username">@GrimCyanide</span></a>
            <a href="https://www.youtube.com/@Grim_Cyanide" class="social-link" target="_blank"><span class="platform">YouTube</span><span class="username">Grim_Cyanide</span></a>
            <a href="/vods" class="social-link"><span class="platform">VODs</span><span class="username">full list + ratings</span></a>
            <a href="https://discord.gg/kUpgQmuDPh" class="social-link" target="_blank"><span class="platform">Discord</span><span class="username">join</span></a>
            <a href="https://www.tiktok.com/@grim_cyanide" class="social-link" target="_blank"><span class="platform">TikTok</span><span class="username">@grim_cyanide</span></a>
            <a href="https://steamcommunity.com/id/GrimCyanide" class="social-link" target="_blank"><span class="platform">Steam</span><span class="username">GrimCyanide</span></a>
        </div>
        <div class="content">
            <div class="twitch-col">
                <div class="twitch-embed" id="twitchEmbed">
                    <iframe src="https://player.twitch.tv/?channel=grim_cyanide&parent=grimcyanide.com" allowfullscreen></iframe>
                </div>
            </div>
            <div class="vods-panel" id="vodsPanel">
                <div class="vods-panel-header">
                    <span>games i've recently finished</span>
                    <a href="/vods">see all →</a>
                </div>
                <div class="vods-list" id="vodsList">
                    <div class="vod-row"><span class="vod-name">loading...</span><span class="vod-rating"></span><span class="vod-status"></span></div>
                </div>
            </div>
        </div>
        <div class="footer">© 2026 grimcyanide.com</div>
    </div>
    <div class="game-popup" id="gamePopup">
        <div class="game-popup-inner" id="gamePopupInner"></div>
    </div>
    <script>
        var allVODs = [];
        function loadVODsData() {
            var list = document.getElementById('vodsList');
            fetch('https://grimcyanide-github-io.vercel.app/api/vods-sheet')
                .then(function(r) { if (!r.ok) throw new Error('API ' + r.status); return r.json(); })
                .then(function(data) {
                    if (data.error) throw new Error(data.error);
                    if (!data.games || !data.games.length) {
                        list.innerHTML = '<div class="vod-row"><span class="vod-name">nothing here yet</span><span class="vod-rating"></span><span class="vod-status"></span></div>';
                        return;
                    }
                    allVODs = data.games;
                    matchPanelHeight();
                    renderVODs();
                })
                .catch(function(e) {
                    console.error(e);
                    list.innerHTML = '<div class="vod-row"><span class="vod-name">couldn\'t load</span><span class="vod-rating"></span><span class="vod-status"></span></div>';
                });
        }
        function matchPanelHeight() {
            var twitch = document.getElementById('twitchEmbed');
            var panel = document.getElementById('vodsPanel');
            if (twitch && panel) {
                var h = twitch.offsetHeight;
                panel.style.maxHeight = h + 'px';
            }
        }
        window.addEventListener('resize', matchPanelHeight);
        function esc(t) {
            var d = document.createElement('div');
            d.textContent = t;
            return d.innerHTML;
        }
        function parseDate(dateStr) {
            if (!dateStr) return null;
            var dmyMatch = dateStr.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
            if (dmyMatch) return new Date(dmyMatch[3], dmyMatch[2] - 1, dmyMatch[1]);
            var parsed = new Date(dateStr);
            if (!isNaN(parsed.getTime())) return parsed;
            return null;
        }
        function fmtParts(pd, p) {
            if (pd) {
                var t = pd;
                if (t.toLowerCase().indexOf('so far') > -1) {
                    t = t.replace(/so far/i, '').trim();
                    if (t.toLowerCase().indexOf('part') === -1) t = t + (t ? ' parts so far' : 'parts so far');
                    else t = t + ' so far';
                } else if (t.toLowerCase().indexOf('part') === -1) {
                    t = t + ' part' + (p !== 1 ? 's' : '');
                }
                return t;
            }
            return p + ' part' + (p !== 1 ? 's' : '');
        }
        function renderVODs() {
            var list = document.getElementById('vodsList');
            var finished = allVODs.filter(function(g) { return g.isFinished === 'Finished'; });
            finished.sort(function(a, b) {
                var dA = parseDate(a.dateFinished);
                var dB = parseDate(b.dateFinished);
                if (!dA && !dB) return 0;
                if (!dA) return 1;
                if (!dB) return -1;
                return dB - dA;
            });
            var recent = finished.slice(0, 10);
            if (!recent.length) {
                list.innerHTML = '<div class="vod-row"><span class="vod-name">no finished games yet</span><span class="vod-rating"></span><span class="vod-status"></span></div>';
                return;
            }
            list.innerHTML = recent.map(function(g, i) {
                var rt = g.rating && g.rating > 0 ? g.rating + '/10' : '—';
                return '<div class="vod-row" onclick="showGamePopup(' + i + ')">' +
                    '<span class="vod-name">' + esc(g.game) + '</span>' +
                    '<span class="vod-rating">' + rt + '</span>' +
                    '<span class="vod-status status-finished">finished</span>' +
                '</div>';
            }).join('');
            window._recentGames = recent;
        }
        function showGamePopup(index) {
            var g = window._recentGames[index];
            if (!g) return;
            var popup = document.getElementById('gamePopup');
            var inner = document.getElementById('gamePopupInner');
            var partsText = fmtParts(g.partsDisplay, g.parts);
            var ratingText = g.rating && g.rating > 0 ? g.rating + '/10' : 'N/A';
            var linkHtml = g.linkUrl ? '<a href="' + esc(g.linkUrl) + '" target="_blank" rel="noopener">watch playlist</a>' : '';
            inner.innerHTML = '<h3>' + esc(g.game) + '</h3>' +
                '<p><strong>rating</strong> ' + ratingText + '</p>' +
                '<p><strong>started</strong> ' + (g.dateStarted || '?') + '</p>' +
                '<p><strong>finished</strong> ' + (g.dateFinished || '—') + '</p>' +
                '<p><strong>parts</strong> ' + partsText + '</p>' +
                (linkHtml ? '<p>' + linkHtml + '</p>' : '') +
                '<p><a href="/vods">view all games →</a></p>' +
                '<button class="game-popup-close" onclick="closePopup()">close</button>';
            popup.classList.add('active');
        }
        function closePopup() {
            document.getElementById('gamePopup').classList.remove('active');
        }
        document.getElementById('gamePopup').addEventListener('click', function(e) {
            if (e.target === this) closePopup();
        });
        var themeToggle = document.getElementById('themeToggle');
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
        }
        themeToggle.addEventListener('click', function() {
            document.body.classList.toggle('light-mode');
            localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
        });
        loadVODsData();
    </script>
</body>
</html>
