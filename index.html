<head>

    <style>
        :root {
            --bg: #0b0e11;
            --surface: #14181d;
            --border: #252a30;
            --text: #c8cdd2;
            --muted: #6b7280;
            --accent: #e85d75;
            --accent-soft: rgba(232, 93, 117, 0.15);
            --green: #4ade80;
            --green-bg: rgba(74, 222, 128, 0.12);
            --amber: #f59e0b;
            --amber-bg: rgba(245, 158, 11, 0.12);
            --radius: 6px;
            --font: system-ui, -apple-system, 'Segoe UI', sans-serif;
        }
        body.light-mode {
            --bg: #f3f4f6;
            --surface: #ffffff;
            --border: #d1d5db;
            --text: #1f2937;
            --muted: #9ca3af;
            --accent: #dc3545;
            --accent-soft: rgba(220, 53, 69, 0.1);
        }
        * {
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
            line-height: 1.4;
            font-size: 15px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 20px 40px;
        }
        .top-row {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.6em;
            margin: 0;
            font-weight: 700;
            letter-spacing: -1px;
            color: var(--text);
        }
        .social-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 32px;
        }
        .social-link {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 16px;
            text-decoration: none;
            color: var(--text);
            font-size: 0.88em;
            transition: border 0.2s, background 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .social-link:hover {
            border-color: var(--accent);
            background: var(--accent-soft);
        }
        .social-link .platform {
            font-weight: 600;
            color: var(--accent);
        }
        .social-link .username {
            color: var(--muted);
            font-size: 0.85em;
        }
        .content {
            display: grid;
            grid-template-columns: 1.8fr 1fr;
            gap: 24px;
            align-items: start;
        }
        @media (max-width: 900px) {
            .content {
                grid-template-columns: 1fr;
            }
        }
        .twitch-embed {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            background: #000;
            aspect-ratio: 16 / 9;
            position: relative;
        }
        .twitch-embed iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
        }
        .vods-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            max-height: 460px;
            overflow: hidden;
        }
        .vods-panel-header {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .vods-panel-header a {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.8em;
            font-weight: 500;
            text-transform: none;
            letter-spacing: 0;
        }
        .vods-panel-header a:hover {
            text-decoration: underline;
        }
        .vod-controls {
            display: flex;
            gap: 4px;
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }
        .vod-control-btn {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--muted);
            font-family: var(--font);
            font-size: 0.7em;
            padding: 5px 8px;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
            text-decoration: none;
        }
        .vod-control-btn:hover {
            border-color: var(--accent);
            color: var(--text);
        }
        .vod-control-btn.active {
            border-color: var(--accent);
            background: var(--accent-soft);
            color: var(--accent);
        }
        .vods-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .vod-row {
            display: grid;
            grid-template-columns: 1fr 60px 80px;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 4px;
            font-size: 0.82em;
            transition: background 0.15s;
            text-decoration: none;
            color: inherit;
        }
        .vod-row:hover {
            background: var(--accent-soft);
        }
        .vod-name {
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .vod-meta {
            color: var(--muted);
            font-size: 0.85em;
            text-align: right;
            white-space: nowrap;
        }
        .vod-status {
            font-size: 0.7em;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 10px;
            text-align: center;
            white-space: nowrap;
        }
        .status-finished {
            background: var(--green-bg);
            color: var(--green);
        }
        .status-unfinished {
            background: var(--amber-bg);
            color: var(--amber);
        }
        .vods-list::-webkit-scrollbar {
            width: 5px;
        }
        .vods-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .vods-list::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        .footer {
            margin-top: 40px;
            text-align: center;
            color: var(--muted);
            font-size: 0.8em;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }
        .theme-toggle {
            background: none;
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--muted);
            font-family: var(--font);
            font-size: 0.75em;
            padding: 5px 10px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .theme-toggle:hover {
            border-color: var(--accent);
            color: var(--text);
        }
        @media (max-width: 600px) {
            .header h1 {
                font-size: 2em;
            }
            .social-link {
                padding: 8px 12px;
                font-size: 0.8em;
            }
            .vod-row {
                grid-template-columns: 1fr 50px 65px;
                gap: 4px;
                font-size: 0.78em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-row">
            <button class="theme-toggle" id="themeToggle">light/dark</button>
        </div>
        <div class="header">
            <h1>GRIM_CYANIDE</h1>
        </div>
        <div class="social-links">
            <a href="https://www.twitch.tv/grim_cyanide" class="social-link" target="_blank"><span class="platform">Twitch</span><span class="username">GRIM_CYANIDE</span></a>
            <a href="https://x.com/GrimCyanide" class="social-link" target="_blank"><span class="platform">X</span><span class="username">@GrimCyanide</span></a>
            <a href="https://www.youtube.com/@Grim_Cyanide" class="social-link" target="_blank"><span class="platform">YouTube</span><span class="username">Grim_Cyanide</span></a>
            <a href="/vods" class="social-link"><span class="platform">VODs</span><span class="username">full list + ratings</span></a>
            <a href="https://discord.gg/kUpgQmuDPh" class="social-link" target="_blank"><span class="platform">Discord</span><span class="username">join</span></a>
            <a href="https://www.tiktok.com/@grim_cyanide" class="social-link" target="_blank"><span class="platform">TikTok</span><span class="username">@grim_cyanide</span></a>
            <a href="https://steamcommunity.com/id/GrimCyanide" class="social-link" target="_blank"><span class="platform">Steam</span><span class="username">GrimCyanide</span></a>
        </div>
        <div class="content">
            <div class="twitch-embed">
                <iframe src="https://player.twitch.tv/?channel=grim_cyanide&parent=grimcyanide.com" allowfullscreen></iframe>
            </div>
            <div class="vods-panel">
                <div class="vods-panel-header">
                    <span>recent playthroughs</span>
                    <a href="/vods">see all →</a>
                </div>
                <div class="vod-controls">
                    <button class="vod-control-btn active" id="btnSortAZ" onclick="setSort('az')">a-z</button>
                    <button class="vod-control-btn" id="btnSortZA" onclick="setSort('za')">z-a</button>
                    <button class="vod-control-btn active" id="btnFilterAll" onclick="setFilter('all')">all</button>
                    <button class="vod-control-btn" id="btnFilterFinished" onclick="setFilter('Finished')">done</button>
                    <button class="vod-control-btn" id="btnFilterUnfinished" onclick="setFilter('Unfinished')">wip</button>
                </div>
                <div class="vods-list" id="vodsList">
                    <div class="vod-row"><span class="vod-name">loading...</span><span class="vod-meta"></span><span class="vod-status"></span></div>
                </div>
            </div>
        </div>
        <div class="footer">© 2026 grimcyanide.com</div>
    </div>
    <script>
        var allVODs = [];
        var currentSort = 'az';
        var currentFilter = 'all';
        function loadVODsData() {
            var list = document.getElementById('vodsList');
            fetch('https://grimcyanide-github-io.vercel.app/api/vods-sheet')
                .then(function(r) { if (!r.ok) throw new Error('API ' + r.status); return r.json(); })
                .then(function(data) {
                    if (data.error) throw new Error(data.error);
                    if (!data.games || !data.games.length) {
                        list.innerHTML = '<div class="vod-row"><span class="vod-name">nothing here yet</span><span class="vod-meta"></span><span class="vod-status"></span></div>';
                        return;
                    }
                    allVODs = data.games;
                    renderVODs();
                })
                .catch(function(e) {
                    console.error(e);
                    list.innerHTML = '<div class="vod-row"><span class="vod-name">couldn\'t load</span><span class="vod-meta"></span><span class="vod-status"></span></div>';
                });
        }
        function esc(t) {
            var d = document.createElement('div');
            d.textContent = t;
            return d.innerHTML;
        }
        function fmtParts(pd, p) {
            if (pd) {
                var t = pd;
                if (t.toLowerCase().indexOf('so far') > -1) {
                    t = t.replace(/so far/i, '').trim();
                    if (t.toLowerCase().indexOf('part') === -1) t = t + (t ? ' parts so far' : 'parts so far');
                    else t = t + ' so far';
                } else if (t.toLowerCase().indexOf('part') === -1) {
                    t = t + ' part' + (p !== 1 ? 's' : '');
                }
                return t;
            }
            return p + ' part' + (p !== 1 ? 's' : '');
        }
        function setSort(s) {
            currentSort = s;
            document.getElementById('btnSortAZ').classList.toggle('active', s === 'az');
            document.getElementById('btnSortZA').classList.toggle('active', s === 'za');
            renderVODs();
        }
        function setFilter(f) {
            currentFilter = f;
            document.getElementById('btnFilterAll').classList.toggle('active', f === 'all');
            document.getElementById('btnFilterFinished').classList.toggle('active', f === 'Finished');
            document.getElementById('btnFilterUnfinished').classList.toggle('active', f === 'Unfinished');
            renderVODs();
        }
        function renderVODs() {
            var list = document.getElementById('vodsList');
            var games = allVODs.slice();
            if (currentFilter !== 'all') games = games.filter(function(g) { return g.isFinished === currentFilter; });
            games.sort(function(a, b) {
                if (currentSort === 'az') return a.game.localeCompare(b.game);
                return b.game.localeCompare(a.game);
            });
            if (!games.length) {
                list.innerHTML = '<div class="vod-row"><span class="vod-name">no matches</span><span class="vod-meta"></span><span class="vod-status"></span></div>';
                return;
            }
            list.innerHTML = games.map(function(g) {
                var rt = g.rating && g.rating > 0 ? g.rating + '/10' : '—';
                var pt = fmtParts(g.partsDisplay, g.parts);
                var st = g.isFinished === 'Finished' ? 'done' : 'wip';
                var sc = g.isFinished === 'Finished' ? 'status-finished' : 'status-unfinished';
                var lk = g.linkUrl ? '<a href="' + esc(g.linkUrl) + '" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:none;font-size:0.8em;">watch</a>' : '';
                return '<div class="vod-row">' +
                    '<span class="vod-name" title="' + esc(g.game) + ' | started ' + (g.dateStarted || '?') + (g.dateFinished ? ' | finished ' + g.dateFinished : '') + '">' + esc(g.game) + '</span>' +
                    '<span class="vod-meta">' + rt + ' &middot; ' + pt + '</span>' +
                    '<span class="vod-status ' + sc + '">' + st + '</span>' +
                '</div>';
            }).join('');
        }
        var themeToggle = document.getElementById('themeToggle');
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
        }
        themeToggle.addEventListener('click', function() {
            document.body.classList.toggle('light-mode');
            localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
        });
        loadVODsData();
    </script>
</body>
