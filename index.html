<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grimcyanide</title>
    <style>
        /* DARK GRIM THEME */
        body {
            background: #0a0a0a;
            color: #00ffff;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 255, 255, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(0, 255, 255, 0.03) 0%, transparent 20%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 3.5em;
            margin: 0;
            text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
            letter-spacing: 3px;
            font-weight: normal;
        }

        .content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
            align-items: stretch;
        }

        @media (max-width: 968px) {
            .content {
                grid-template-columns: 1fr;
            }
        }

        .twitch-section {
            position: relative;
        }

        .status-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ff0000;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            z-index: 10;
            animation: pulse 2s infinite;
        }

        .status-indicator.offline {
            background: #666;
            animation: none;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .twitch-embed {
            border: 2px solid #00ffff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
            background: #000;
            position: relative;
            aspect-ratio: 16 / 9;
        }

        .twitch-embed iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
        }

        .playlists-section {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .playlists-section h3 {
            border-bottom: 1px solid #00ffff;
            padding-bottom: 10px;
            margin-top: 0;
        }

        .playlists-container {
            flex: 1;
            max-height: none;
            height: 100%;
            overflow-y: auto;
            border: 1px solid #004444;
            border-radius: 8px;
            padding: 10px;
        }

        .playlist-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .playlist-item {
            background: rgba(0, 255, 255, 0.05);
            border: 1px solid #004444;
            border-radius: 8px;
            padding: 15px;
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
            display: block;
            text-align: center;
        }

        .playlist-item:hover {
            border-color: #00ffff;
            background: rgba(0, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .playlist-title {
            font-weight: bold;
            margin-bottom: 8px;
            color: #88ffff;
            line-height: 1.3;
            text-align: center;
        }

        .playlist-meta {
            color: #008888;
            font-size: 0.9em;
            display: flex;
            justify-content: center;
        }

        .playlist-count {
            background: rgba(0, 100, 100, 0.3);
            color: #00cccc;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8em;
            border: 1px solid #008888;
        }

        .social-links {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin: 40px 0;
        }

        @media (max-width: 768px) {
            .social-links {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .social-links {
                grid-template-columns: 1fr;
            }
        }

        .social-link {
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid #00ffff;
            border-radius: 8px;
            padding: 20px;
            text-decoration: none;
            color: #00ffff;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .social-link:hover {
            background: rgba(0, 255, 255, 0.2);
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(0, 255, 255, 0.4);
        }

        .social-link .platform {
            font-weight: bold;
            display: block;
            font-size: 1.1em;
            margin-bottom: 5px;
        }

        .social-link .username {
            color: #88ffff;
            font-size: 0.9em;
        }

        .footer {
            margin-top: 50px;
            color: #008888;
            font-size: 0.9em;
            border-top: 1px solid #004444;
            padding-top: 20px;
            text-align: center;
        }

        /* Scrollbar styling */
        .playlists-container::-webkit-scrollbar {
            width: 8px;
        }

        .playlists-container::-webkit-scrollbar-track {
            background: #001a1a;
            border-radius: 4px;
        }

        .playlists-container::-webkit-scrollbar-thumb {
            background: #00ffff;
            border-radius: 4px;
        }

        .playlists-container::-webkit-scrollbar-thumb:hover {
            background: #00cccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>GRIMCYANIDE</h1>
        </div>

        <div class="content">
            <div class="twitch-section">
                <div class="status-indicator offline" id="statusIndicator">OFFLINE</div>
                <div class="twitch-embed">
                    <iframe 
                        src="https://player.twitch.tv/?channel=grim_cyanide&parent=grimcyanide.github.io" 
                        allowfullscreen>
                    </iframe>
                </div>
            </div>

            <div class="playlists-section">
                <h3>PLAYTHROUGH VODS</h3>
                <div class="playlists-container">
                    <div class="playlist-list" id="playlistList">
                        <div class="playlist-item">
                            <div class="playlist-title">Loading playlists...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="social-links">
            <a href="https://www.twitch.tv/grim_cyanide" class="social-link" target="_blank">
                <span class="platform">Twitch</span>
                <span class="username">grim_cyanide</span>
            </a>
            <a href="https://x.com/GrimCyanide" class="social-link" target="_blank">
                <span class="platform">Twitter / X</span>
                <span class="username">GrimCyanide</span>
            </a>
            <a href="https://www.youtube.com/@Grim_Cyanide" class="social-link" target="_blank">
                <span class="platform">YouTube</span>
                <span class="username">Grim_Cyanide</span>
            </a>
            <a href="https://www.tiktok.com/@grim_cyanide" class="social-link" target="_blank">
                <span class="platform">TikTok</span>
                <span class="username">grim_cyanide</span>
            </a>
            <a href="https://steamcommunity.com/id/GrimCyanide" class="social-link" target="_blank">
                <span class="platform">Steam</span>
                <span class="username">GrimCyanide</span>
            </a>
        </div>

        <div class="footer">
            © 2025 grimcyanide.com
        </div>
    </div>

<script>
    // YouTube Playlists via secure serverless function
    const CHANNEL_NAME = 'grim_cyanide';
    const YOUTUBE_CHANNEL_ID = 'Grim_Cyanide';
    
    async function checkStreamStatus() {
        const statusIndicator = document.getElementById('statusIndicator');
        
        try {
            const response = await fetch(`https://twitch.tv/${CHANNEL_NAME}`);
            const html = await response.text();
            
            if (html.includes('isLiveBroadcast') || html.includes('"isLive":true')) {
                statusIndicator.textContent = 'LIVE';
                statusIndicator.className = 'status-indicator';
            } else {
                statusIndicator.textContent = 'OFFLINE';
                statusIndicator.className = 'status-indicator offline';
            }
        } catch (error) {
            statusIndicator.textContent = 'OFFLINE';
            statusIndicator.className = 'status-indicator offline';
        }
    }

    async function loadYouTubePlaylists() {
        const playlistList = document.getElementById('playlistList');
        
        try {
            // Use our secure serverless function
            const response = await fetch(`/api/youtube-playlists?channel=${YOUTUBE_CHANNEL_ID}`);
            const data = await response.json();
            
            if (data.error) {
                throw new Error(data.error);
            }
            
            if (!data.playlists || data.playlists.length === 0) {
                throw new Error('No playlists found');
            }
            
            playlistList.innerHTML = '';
            
            // Sort playlists A-Z by title
            data.playlists.sort((a, b) => a.title.localeCompare(b.title));
            
            data.playlists.forEach(playlist => {
                const playlistItem = document.createElement('a');
                playlistItem.href = playlist.url;
                playlistItem.target = '_blank';
                playlistItem.className = 'playlist-item';
                
                playlistItem.innerHTML = `
                    <div class="playlist-title">${playlist.title}</div>
                    <div class="playlist-meta">
                        <span class="playlist-count">${playlist.count} ${playlist.count === 1 ? 'video' : 'videos'}</span>
                    </div>
                `;
                
                playlistList.appendChild(playlistItem);
            });
            
        } catch (error) {
            console.error('Playlist Error:', error);
            playlistList.innerHTML = `
                <a href="https://www.youtube.com/@${YOUTUBE_CHANNEL_ID}/playlists" class="playlist-item" target="_blank">
                    <div class="playlist-title">View Playlists on YouTube</div>
                    <div class="playlist-meta">Click to see all playthrough VODs</div>
                </a>
            `;
        }
    }

    // Initialize
    checkStreamStatus();
    loadYouTubePlaylists();

    // Refresh status every 2 minutes
    setInterval(checkStreamStatus, 120000);
</script>
</body>
</html>
