<body>
    <div class="theme-toggle">

            <input type="checkbox" id="themeToggle">

            </a>

                <span class="platform">Steam</span>

            </a>

        <div class="content">
            <div class="twitch-section">
                <div class="twitch-embed">
                    <iframe
                        src="https://player.twitch.tv/?channel=grim_cyanide&parent=grimcyanide.com"
                        allowfullscreen>
                    </iframe>
                </div>
            </div>

            <div class="playlists-section">
                <h3>PLAYTHROUGH VODS</h3>
                <div class="vod-controls">
                    <button class="vod-control-btn active" id="btnSortAZ" onclick="setSort('az')">A-Z</button>
                    <button class="vod-control-btn" id="btnSortZA" onclick="setSort('za')">Z-A</button>
                    <button class="vod-control-btn active" id="btnFilterAll" onclick="setFilter('all')">All</button>
                    <button class="vod-control-btn" id="btnFilterFinished" onclick="setFilter('Finished')">Fin</button>
                    <button class="vod-control-btn" id="btnFilterUnfinished" onclick="setFilter('Unfinished')">Unf</button>
                    <a href="/vods" class="vod-control-btn">More →</a>
                </div>
                <div class="playlists-container">
                    <div class="playlist-list" id="playlistList">
                        <div class="playlist-item">
                            <div class="vod-title" style="text-align:center;">Loading playthroughs...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer">
            © 2026 grimcyanide.com
        </div>
    </div>

    <script>
        let allVODs = [];
        let currentSort = 'az';
        let currentFilter = 'all';

        async function loadVODsData() {
            const playlistList = document.getElementById('playlistList');
            try {
                const response = await fetch('https://grimcyanide-github-io.vercel.app/api/vods-sheet');
                if (!response.ok) throw new Error(`API returned ${response.status}`);
                const data = await response.json();
                if (data.error) throw new Error(data.error);
                if (!data.games || data.games.length === 0) {
                    playlistList.innerHTML = '<div class="playlist-item"><div class="vod-title" style="text-align:center;">No playthroughs found yet.</div></div>';
                    return;
                }
                allVODs = data.games;
                renderVODs();
            } catch (error) {
                console.error('VODs Error:', error);
                playlistList.innerHTML = '<div class="playlist-item"><div class="vod-title" style="text-align:center;">Error loading VODs</div></div>';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatParts(partsDisplay, parts) {
            if (partsDisplay) {
                let text = partsDisplay;
                if (text.toLowerCase().includes('so far')) {
                    text = text.replace(/so far/i, '').trim();
                    if (!text.toLowerCase().includes('part')) {
                        text = text + (text ? ' parts so far' : 'parts so far');
                    } else {
                        text = text + ' so far';
                    }
                } else if (!text.toLowerCase().includes('part')) {
                    text = text + ' part' + (parts !== 1 ? 's' : '');
                }
                return text;
            }
            return parts + ' part' + (parts !== 1 ? 's' : '');
        }

        function setSort(sort) {
            currentSort = sort;
            document.getElementById('btnSortAZ').classList.remove('active');
            document.getElementById('btnSortZA').classList.remove('active');
            if (sort === 'az') document.getElementById('btnSortAZ').classList.add('active');
            if (sort === 'za') document.getElementById('btnSortZA').classList.add('active');
            renderVODs();
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.getElementById('btnFilterAll').classList.remove('active');
            document.getElementById('btnFilterFinished').classList.remove('active');
            document.getElementById('btnFilterUnfinished').classList.remove('active');
            if (filter === 'all') document.getElementById('btnFilterAll').classList.add('active');
            if (filter === 'Finished') document.getElementById('btnFilterFinished').classList.add('active');
            if (filter === 'Unfinished') document.getElementById('btnFilterUnfinished').classList.add('active');
            renderVODs();
        }

        function renderVODs() {
            const playlistList = document.getElementById('playlistList');
            let games = [...allVODs];

            if (currentFilter !== 'all') {
                games = games.filter(g => g.isFinished === currentFilter);
            }

            games.sort((a, b) => {
                if (currentSort === 'az') return a.game.localeCompare(b.game);
                if (currentSort === 'za') return b.game.localeCompare(a.game);
                return 0;
            });

            if (games.length === 0) {
                playlistList.innerHTML = '<div class="playlist-item"><div class="vod-title" style="text-align:center;">No playthroughs match filter.</div></div>';
                return;
            }

            playlistList.innerHTML = '';
            games.forEach(game => {
                const item = document.createElement('div');
                item.className = 'playlist-item';
                const ratingText = game.rating && game.rating > 0 ? `Rating: ${game.rating}/10` : 'Rating: N/A';
                const partsText = formatParts(game.partsDisplay, game.parts);
                const linkHtml = game.linkUrl
                    ? `<a href="${escapeHtml(game.linkUrl)}" target="_blank" rel="noopener" class="vod-link">▶ ${escapeHtml(game.linkText || 'Watch')}</a>`
                    : '';
                item.innerHTML = `
                    <div class="vod-header">
                        <span class="vod-title">${escapeHtml(game.game)}</span>
                        <span class="vod-status ${game.isFinished === 'Finished' ? 'status-finished' : 'status-unfinished'}">${game.isFinished === 'Finished' ? 'Finished' : 'Unfinished'}</span>
                    </div>
                    <div class="vod-details">
                        <span class="vod-rating">${ratingText}</span>
                        <span class="vod-parts">${partsText}</span>
                    </div>
                    <div class="vod-dates">
                        <span>Started: ${escapeHtml(game.dateStarted || '?')}</span>
                        ${game.dateFinished ? `<span>Finished: ${escapeHtml(game.dateFinished)}</span>` : '<span>Finished: —</span>'}
                    </div>
                    ${linkHtml}
                `;
                playlistList.appendChild(item);
            });
        }

        const themeToggle = document.getElementById('themeToggle');
        const currentTheme = localStorage.getItem('theme');
        if (currentTheme === 'light') {
            document.body.classList.add('light-mode');
            themeToggle.checked = true;
        }
        themeToggle.addEventListener('change', function() {
            if (this.checked) {
                document.body.classList.add('light-mode');
                localStorage.setItem('theme', 'light');
            } else {
                document.body.classList.remove('light-mode');
                localStorage.setItem('theme', 'dark');
            }
        });

        loadVODsData();
    </script>
</body>
</html>
